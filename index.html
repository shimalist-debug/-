                </div>}
                <div className="dv-ev-t">{ev.title}</div>
                {pos.height>36&&ev.startTime&&<div className="dv-ev-sub">{ev.startTime}{ev.endTime?' 〜 '+ev.endTime:''}</div>}
                {pos.height>52&&mem&&<div className="dv-ev-mem">{mem.emoji} {mem.name}</div>}
              </div>
            );
          })}
        </div>
      </div>

      {/* 選択モード起動ボタン（日ビュー） */}
      {!selectMode&&dayEvs.length>0&&(
        <div style={{padding:'4px 12px 0',display:'flex',justifyContent:'flex-end'}}>
          <button onClick={onEnterSelect} style={{border:'1.5px solid var(--bd)',background:'#fff',color:'var(--ts)',borderRadius:'8px',padding:'5px 12px',fontWeight:'700',fontSize:'12px',cursor:'pointer',touchAction:'manipulation'}}>選択して削除</button>
        </div>
      )}

      {/* Diary section */}
      <div className="diary-sec" style={{marginTop:'8px'}}>
        <div className="diary-hdr">
          <span style={{fontSize:'15px'}}>📔</span>
          <span className="diary-title">日記・メモ</span>
          {(diary[selDate]?.length||0)>0&&<span style={{fontSize:'10px',color:'var(--tl)',marginLeft:'auto'}}>{diary[selDate].length}文字</span>}
        </div>
        <textarea className="diary-ta"
          placeholder={`${fmtJa(selDate)}の出来事や気になったことを…`}
          value={diary[selDate]||''}
          onChange={e=>onDiaryChange(selDate,e.target.value)}/>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════
   CALENDAR VIEW  (month/week/day container)
══════════════════════════════════════════════════ */
function CalendarView({events,members,diary,dateColors,onSetDateColor,onDiaryChange,onAdd,onEdit,onDeleteMultiple}){
  const[calView,setCalView]=useState('month');  // month | week | day
  const[selDate,setSelDate]=useState(todayStr());
  const today=todayStr();
  const[vDate,setVDate]=useState(new Date());
  const y=vDate.getFullYear(),m=vDate.getMonth();
  const days=useMemo(()=>monthDays(y,m),[y,m]);
  const byDate=useMemo(()=>{const mp={};events.forEach(ev=>{if(!mp[ev.date])mp[ev.date]=[];mp[ev.date].push(ev);});return mp;},[events]);
  const getColor=id=>members.find(x=>x.id===id)?.color||'#9CA3AF';

  const selEvs=useMemo(()=>(byDate[selDate]||[]).slice().sort((a,b)=>{
    if(!a.startTime&&!b.startTime)return 0;if(!a.startTime)return 1;if(!b.startTime)return -1;
    return a.startTime.localeCompare(b.startTime);
  }),[byDate,selDate]);

  const handleAdd=(date,time)=>{onAdd(date,time);};
  const handleSelectDate=date=>{setSelDate(date);const d=parseD(date);setVDate(new Date(d.getFullYear(),d.getMonth(),1));};

  // ── 複数選択モード ──
  const[selectMode,setSelectMode]=useState(false);
  const[selectedIds,setSelectedIds]=useState(new Set());
  const toggleSelectId=id=>setSelectedIds(prev=>{const s=new Set(prev);s.has(id)?s.delete(id):s.add(id);return s;});
  const exitSelectMode=()=>{setSelectMode(false);setSelectedIds(new Set());};
  const deleteSelected=()=>{
    if(selectedIds.size===0)return;
    if(!confirm(`${selectedIds.size}件の予定を削除しますか？`))return;
    onDeleteMultiple(selectedIds);
    exitSelectMode();
  };

  // ── スワイプナビゲーション（月・週・日 共通）──
  const swipeRef=React.useRef(null);
  const handleTouchStart=e=>{
    const t=e.touches[0];
    swipeRef.current={x:t.clientX,y:t.clientY};
  };
  const handleTouchEnd=e=>{
    if(!swipeRef.current)return;
    const dx=e.changedTouches[0].clientX-swipeRef.current.x;
    const dy=e.changedTouches[0].clientY-swipeRef.current.y;
    swipeRef.current=null;
    // 縦スクロールより横移動が大きく、50px以上の場合のみ
    if(Math.abs(dx)<=Math.abs(dy)||Math.abs(dx)<50)return;
    const d=parseD(selDate);
    if(calView==='month'){
      setVDate(new Date(y,m+(dx>0?-1:1),1));
    }else if(calView==='week'){
      const delta=dx>0?-7:7;
      handleSelectDate(fmt(new Date(d.getFullYear(),d.getMonth(),d.getDate()+delta)));
    }else if(calView==='day'){
      const delta=dx>0?-1:1;
      handleSelectDate(fmt(new Date(d.getFullYear(),d.getMonth(),d.getDate()+delta)));
    }
  };

  return(
    <div onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd} style={{touchAction:'pan-y'}}>
      {/* View toggle + nav */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 16px 4px'}}>
        <div className="view-toggle">
          {[['month','月'],['week','週'],['day','日']].map(([v,l])=>(
            <button key={v} className={`vbtn ${calView===v?'on':''}`} onClick={()=>setCalView(v)}>{l}</button>
          ))}
        </div>
        <button onClick={()=>handleSelectDate(today)}
          style={{border:'none',background:selDate===today?'var(--pl)':'#F3F4F6',color:selDate===today?'var(--p)':'var(--ts)',borderRadius:'20px',padding:'5px 12px',fontWeight:'700',fontSize:'12px',cursor:'pointer'}}>
          今日
        </button>
      </div>

      {calView==='month'&&(
        <div>
          <div className="cal-wrap">
            <div className="cal-nav">
              <button className="cal-nav-btn" onClick={()=>setVDate(new Date(y,m-1,1))}>‹</button>
              <h2>{y}年 {MONTHS[m]}</h2>
              <button className="cal-nav-btn" onClick={()=>setVDate(new Date(y,m+1,1))}>›</button>
            </div>
            <div className="cal-grid">
              {DAYS.map((d,i)=><div key={d} className={`dh ${i===0?'sun':''} ${i===6?'sat':''}`}>{d}</div>)}
              {days.map(({date,cur})=>{
                const evs=byDate[date]||[];
                const hasDiary=!!(diary[date]?.trim());
                const dow=new Date(date).getDay();
                const dn=parseInt(date.split('-')[2]);
                const hol=isHoliday(date);
                const markId=dateColors?.[date];
                const markCol=markId?members.find(mm=>mm.id===markId)?.color:null;
                const cellStyle=markCol?{background:lightenColor(markCol,0.22)}:undefined;
                return(
                  <div key={date} className={`dc ${!cur?'other':''} ${date===today?'today':''} ${date===selDate?'sel':''} ${dow===0?'suncol':''} ${dow===6?'satcol':''} ${hol?'holiday':''} ${markCol?'marked':''}`}
                    style={cellStyle}
                    onClick={()=>setSelDate(date)}>
                    <div className="dn">{dn}</div>
                    <div className="dots">
                      {evs.slice(0,2).map((ev,i)=><div key={i} className="dot" style={{background:getColor(ev.memberId)}}/>)}
                      {evs.length>2&&<div style={{fontSize:'7px',color:'var(--tl)',lineHeight:'8px',marginTop:'1px'}}>+{evs.length-2}</div>}
                      {hasDiary&&<div className="dot-d"/>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
          {/* Selected day events */}
          <div className="ev-sec">
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div className="sec-t" style={{margin:0}}>
                {fmtJa(selDate)}
                {isHoliday(selDate)&&<span className="holiday-tag">🎌 {isHoliday(selDate)}</span>}
                <span style={{marginLeft:'4px'}}>の予定</span>
              </div>
              {selEvs.length>0&&(
                selectMode
                  ?<div style={{display:'flex',gap:'8px'}}>
                    {selectedIds.size>0&&<button onClick={deleteSelected} style={{border:'none',background:'#FEE2E2',color:'#DC2626',borderRadius:'8px',padding:'5px 11px',fontWeight:'800',fontSize:'12px',cursor:'pointer',touchAction:'manipulation'}}>🗑 {selectedIds.size}件削除</button>}
                    <button onClick={exitSelectMode} style={{border:'1.5px solid var(--bd)',background:'#fff',color:'var(--ts)',borderRadius:'8px',padding:'5px 11px',fontWeight:'700',fontSize:'12px',cursor:'pointer',touchAction:'manipulation'}}>キャンセル</button>
                  </div>
                  :<button onClick={()=>setSelectMode(true)} style={{border:'1.5px solid var(--bd)',background:'#fff',color:'var(--ts)',borderRadius:'8px',padding:'5px 11px',fontWeight:'700',fontSize:'12px',cursor:'pointer',touchAction:'manipulation'}}>選択</button>
              )}
            </div>
            {/* Date color marker */}
            {!selectMode&&(
              <div className="date-mark-row">
                <span className="lbl">📌 マーク</span>
                <button className={`sw none ${!dateColors?.[selDate]?'on':''}`} onClick={()=>onSetDateColor(selDate,null)} aria-label="マーク解除">×</button>
                {members.map(mem=>{
                  const on=dateColors?.[selDate]===mem.id;
                  return(
                    <button key={mem.id} className={`sw ${on?'on':''}`} title={mem.name}
                      style={{background:lightenColor(mem.color,0.45),color:mem.color}}
                      onClick={()=>onSetDateColor(selDate,on?null:mem.id)}>
                      {mem.emoji}
                    </button>
                  );
                })}
              </div>
            )}
            {selEvs.length===0
              ?<div style={{textAlign:'center',padding:'14px 0',color:'var(--tl)',fontSize:'13px'}}>予定はありません</div>
              :selEvs.map(ev=>{
                const mem=members.find(x=>x.id===ev.memberId);
                const isSelected=selectedIds.has(ev.id);
                return(
                  <div key={ev.id} className="ev-item"
                    style={isSelected?{background:'#EEF2FF',borderRadius:'12px'}:{}}
                    onClick={()=>selectMode?toggleSelectId(ev.id):onEdit(ev)}>
                    {selectMode
                      ?<div style={{width:24,height:24,borderRadius:'50%',border:`2px solid ${isSelected?'var(--p)':'var(--bd)'}`,background:isSelected?'var(--p)':'#fff',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginRight:4}}>
                        {isSelected&&<span style={{color:'#fff',fontSize:'14px',fontWeight:'900'}}>✓</span>}
                      </div>
                      :<div className="ev-bar" style={{background:mem?.color||'#9CA3AF'}}/>
                    }
                    <div className="ev-main">
                      <div className="ev-t">{ev.title}</div>
                      <div className="ev-sub">
                        {mem&&<span>{mem.emoji} {mem.name}</span>}
                        {ev.startTime&&<span>🕐 {ev.startTime}{ev.endTime?' - '+ev.endTime:''}</span>}
                        {ev.isBasketball&&<span className="ev-badge">🏀 バスケ</span>}
                        {ev.recurring&&ev.recurring!=='none'&&<span className="ev-recur-badge">🔁 繰返</span>}
                      </div>
                    </div>
                    {!selectMode&&<div className="ev-arrow">›</div>}
                  </div>
                );
              })
            }
          </div>
          {/* Diary */}
          <div className="diary-sec">
            <div className="diary-hdr">
              <span style={{fontSize:'15px'}}>📔</span>
              <span className="diary-title">日記・メモ</span>
              {(diary[selDate]?.length||0)>0&&<span style={{fontSize:'10px',color:'var(--tl)',marginLeft:'auto'}}>{diary[selDate].length}文字</span>}
            </div>
            <textarea className="diary-ta"
              placeholder={`${fmtJa(selDate)}の出来事、感じたことを…`}
              value={diary[selDate]||''}
              onChange={e=>onDiaryChange(selDate,e.target.value)}/>
          </div>
        </div>
      )}

      {calView==='week'&&(
        <WeekView events={events} members={members} diary={diary}
          selDate={selDate} today={today}
          onSelectDate={d=>{setSelDate(d);setCalView('day');}}
          onNavigate={d=>setSelDate(d)}
          onEdit={onEdit}
          onAdd={(date,time)=>handleAdd(date,time)}/>
      )}

      {calView==='day'&&(
        <DayView events={events} members={members} diary={diary}
          selDate={selDate} today={today}
          onSelectDate={handleSelectDate}
          onEdit={onEdit}
          onAdd={(date,time)=>handleAdd(date,time)}
          onDiaryChange={onDiaryChange}
          selectMode={selectMode} selectedIds={selectedIds}
          onToggleSelect={toggleSelectId}
          onEnterSelect={()=>setSelectMode(true)}
          onExitSelect={exitSelectMode}
          onDeleteSelected={deleteSelected}/>
      )}

      {calView==='month'&&<button className="fab" onClick={()=>handleAdd(selDate,'')}>＋</button>}
      {calView==='day'&&<button className="fab" onClick={()=>handleAdd(selDate,'')}>＋</button>}
    </div>
  );
}

/* ══════════════════════════════════════════════════
   DIARY VIEW (tab)
══════════════════════════════════════════════════ */
function DiaryView({diary,onDiaryChange}){
  const[editing,setEditing]=useState(null);
  const[editText,setEditText]=useState('');
  const entries=useMemo(()=>Object.entries(diary).filter(([,v])=>v?.trim()).sort(([a],[b])=>b.localeCompare(a)),[diary]);
  const grouped=useMemo(()=>{const m={};entries.forEach(([d,t])=>{const k=d.slice(0,7);if(!m[k])m[k]=[];m[k].push([d,t]);});return Object.entries(m).sort(([a],[b])=>b.localeCompare(a));},[entries]);
  const openEdit=(date,text)=>{setEditing(date);setEditText(text);}
  const saveEdit=()=>{onDiaryChange(editing,editText);setEditing(null);}
  const delEntry=()=>{if(confirm('この日記を削除しますか？')){onDiaryChange(editing,'');setEditing(null);}}

  if(entries.length===0)return(
    <div className="empty">
      <div className="empty-ic">📔</div>
      <div className="empty-t">日記がまだありません</div>
      <div className="empty-s">カレンダーで日付をタップすると<br/>下に日記・メモ欄が表示されます</div>
    </div>
  );

  return(
    <div>
      <div style={{padding:'14px 16px 0',fontSize:'21px',fontWeight:'900'}}>📔 日記</div>
      <div style={{padding:'3px 16px 10px',fontSize:'12px',color:'var(--ts)'}}>{entries.length}件</div>
      <div className="dl-sec">
        {grouped.map(([mk,mes])=>(
          <div key={mk}>
            <div className="dl-mhdr">{fmtMonJa(mk+'-01')}</div>
            {mes.map(([date,text])=>(
              <div key={date} className="dl-card" onClick={()=>openEdit(date,text)}>
                <div className="dl-card-date">📅 {fmtJa(date)}</div>
                <div className="dl-card-pre">{text}</div>
                <div className="dl-card-len">{text.length}文字</div>
              </div>
            ))}
          </div>
        ))}
      </div>
      {editing&&(
        <div className="overlay" onClick={e=>e.target===e.currentTarget&&saveEdit()}>
          <div className="de-sheet">
            <div className="s-handle"/>
            <div className="s-hdr">
              <div><div style={{fontSize:'12px',fontWeight:'800',color:'var(--d)'}}>{fmtJa(editing)}</div><div className="s-title">日記を編集</div></div>
              <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
                <button onClick={delEntry} style={{padding:'6px 12px',borderRadius:'10px',border:'none',background:'#FEE2E2',color:'#DC2626',fontWeight:'700',fontSize:'12px',cursor:'pointer'}}>削除</button>
                <button className="x-btn" onClick={saveEdit}>✓</button>
              </div>
            </div>
            <div className="de-body">
              <textarea className="de-ta" value={editText} onChange={e=>setEditText(e.target.value)} autoFocus placeholder="今日あったこと…"/>
              <div style={{fontSize:'10px',color:'var(--tl)',textAlign:'right',marginTop:'5px'}}>{editText.length}文字</div>
            </div>
            <button className="btn-p" onClick={saveEdit}>保存する</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════
   BASKETBALL VIEW
══════════════════════════════════════════════════ */
function BasketballView({events,members,onEdit,venueNotes,onSaveVenueNote}){
  const bkEvs=useMemo(()=>events.filter(e=>e.isBasketball).sort((a,b)=>b.date.localeCompare(a.date)),[events]);
  // games配列対応の統計（normBKで旧形式も変換）
  const stats=useMemo(()=>{
    let wins=0,losses=0,played=0;
    bkEvs.forEach(ev=>{
      const b=normBK(ev.basketball);
      if(!b)return;
      (b.games||[]).forEach(g=>{
        if(g.myScore!==null&&g.myScore!==undefined&&g.opponentScore!==null&&g.opponentScore!==undefined){
          played++;
          if(g.myScore>g.opponentScore)wins++;
          else if(g.myScore<g.opponentScore)losses++;
        }
      });
    });
    return{total:bkEvs.length,played,wins,losses};
  },[bkEvs]);
  const getGameResult=g=>{if(g.myScore===null||g.myScore===undefined||g.opponentScore===null||g.opponentScore===undefined)return null;return g.myScore>g.opponentScore?'win':g.myScore<g.opponentScore?'lose':'draw';};
  const getMem=id=>members.find(m=>m.id===id);
  const winPct=stats.played>0?Math.round(stats.wins/stats.played*100):0;
  const[tab,setTab]=useState('games');
  const[editVenue,setEditVenue]=useState(null);
  const[detailEv,setDetailEv]=useState(null); // 詳細表示中のイベント
  const venueList=Object.entries(venueNotes||{});

  if(bkEvs.length===0)return<div className="empty"><div className="empty-ic">🏀</div><div className="empty-t">試合記録がありません</div><div className="empty-s">予定追加時に「バスケの試合として記録」をONにしてください</div></div>;
  return(
    <div>
    {/* ── 試合詳細シート ── */}
    {detailEv&&(()=>{
      const ev=detailEv;
      const b=normBK(ev.basketball);
      const mem=getMem(ev.memberId);
      const games=b?.games||[];
      return(
        <div className="overlay" onClick={e=>e.target===e.currentTarget&&setDetailEv(null)}>
          <div className="sheet">
            <div className="s-handle"/>
            <div className="s-hdr">
              <span className="s-title">試合結果</span>
              <button className="x-btn" onClick={()=>setDetailEv(null)}
                onTouchEnd={e=>{e.preventDefault();e.stopPropagation();setDetailEv(null);}}>✕</button>
            </div>
            {/* 基本情報 */}
            <div style={{padding:'4px 16px 12px'}}>
              {b?.tournamentName&&<div style={{fontSize:'11px',fontWeight:'700',color:'var(--p)',marginBottom:'4px',textTransform:'uppercase',letterSpacing:'.5px'}}>{b.tournamentName}</div>}
              <div style={{fontSize:'18px',fontWeight:'800',marginBottom:'6px'}}>{ev.title}</div>
              <div style={{display:'flex',gap:'12px',flexWrap:'wrap',fontSize:'12px',color:'var(--ts)',fontWeight:'600'}}>
                <span>📅 {fmtJa(ev.date)}</span>
                {b?.venue&&<span>📍 {b.venue}</span>}
                {mem&&<span style={{color:mem.color}}>{mem.emoji} {mem.name}</span>}
              </div>
            </div>
            <div className="divider"/>
            {/* 試合結果一覧 */}
            <div style={{padding:'10px 16px'}}>
              {games.length===0&&<div style={{color:'var(--tl)',fontSize:'13px',textAlign:'center',padding:'20px'}}>試合データがありません</div>}
              {games.map((g,i)=>{
                const res=getGameResult(g);
                const hasScore=g.myScore!==null&&g.myScore!==undefined&&g.opponentScore!==null&&g.opponentScore!==undefined;
                return(
                  <div key={i} style={{background:res==='win'?'#F0FDF4':res==='lose'?'#FEF2F2':'#F8FAFC',border:`1.5px solid ${res==='win'?'#86EFAC':res==='lose'?'#FECACA':'var(--bd)'}`,borderRadius:'14px',padding:'14px',marginBottom:'10px'}}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'10px'}}>
                      <span style={{fontSize:'12px',fontWeight:'800',color:'var(--ts)'}}>第{i+1}試合</span>
                      {res&&<span style={{fontSize:'12px',fontWeight:'800',padding:'3px 10px',borderRadius:'20px',background:res==='win'?'#16A34A':'#DC2626',color:'#fff'}}>{res==='win'?'🏆 勝利':'😤 敗北'}</span>}
                      {!res&&<span style={{fontSize:'12px',fontWeight:'700',color:'var(--tl)'}}>未登録</span>}
                    </div>
                    {g.opponent&&<div style={{textAlign:'center',fontSize:'13px',color:'var(--ts)',marginBottom:'8px',fontWeight:'600'}}>vs {g.opponent}</div>}
                    {hasScore&&(
                      <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'16px'}}>
                        <div style={{textAlign:'center'}}>
                          <div style={{fontSize:'11px',color:'var(--ts)',fontWeight:'700',marginBottom:'3px'}}>自チーム</div>
                          <div style={{fontSize:'40px',fontWeight:'900',color:res==='win'?'#16A34A':res==='lose'?'#DC2626':'var(--t)',lineHeight:1}}>{g.myScore}</div>
                        </div>
                        <div style={{fontSize:'22px',fontWeight:'900',color:'var(--tl)'}}>−</div>
                        <div style={{textAlign:'center'}}>
                          <div style={{fontSize:'11px',color:'var(--ts)',fontWeight:'700',marginBottom:'3px'}}>相手</div>
                          <div style={{fontSize:'40px',fontWeight:'900',color:'var(--t)',lineHeight:1}}>{g.opponentScore}</div>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
              {ev.notes&&<div style={{fontSize:'13px',color:'var(--ts)',background:'#F8FAFC',borderRadius:'10px',padding:'10px 12px',marginTop:'4px',lineHeight:'1.6'}}>📝 {ev.notes}</div>}
            </div>
            <div className="divider"/>
            <div style={{padding:'8px 16px 4px',display:'flex',gap:'10px'}}>
              <button className="btn-p" style={{flex:1}} onClick={()=>{setDetailEv(null);onEdit(ev);}}>✏️ 編集する</button>
            </div>
            <div style={{height:'8px'}}/>
          </div>
        </div>
      );
    })()}
    <div>
      {/* タブ切替 */}
      <div style={{display:'flex',padding:'10px 12px 0',gap:'8px'}}>
        {[{id:'games',l:'試合記録'},{id:'venues',l:`📍 会場メモ${venueList.length>0?' ('+venueList.length+')':''}`}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:'8px 4px',border:'none',borderRadius:'10px',fontSize:'13px',fontWeight:'700',cursor:'pointer',background:tab===t.id?'var(--p)':'#F1F5F9',color:tab===t.id?'#fff':'var(--ts)'}}>{t.l}</button>
        ))}
      </div>

      {tab==='games'&&<>
        <div className="stats-grid">
          <div className="stat-card"><div className="stat-val" style={{color:'var(--t)'}}>{stats.total}</div><div className="stat-lbl">試合数</div></div>
          <div className="stat-card"><div className="stat-val" style={{color:'#16A34A'}}>{stats.wins}</div><div className="stat-lbl">勝利</div></div>
          <div className="stat-card"><div className="stat-val" style={{color:'#DC2626'}}>{stats.losses}</div><div className="stat-lbl">敗北</div></div>
        </div>
        {stats.played>0&&<div style={{background:'#fff',borderRadius:'14px',padding:'13px 15px',margin:'0 12px 12px',boxShadow:'0 1px 4px rgba(0,0,0,.07)'}}>
          <div style={{fontSize:'11px',fontWeight:'700',color:'var(--ts)',marginBottom:'7px'}}>勝率</div>
          <div style={{display:'flex',alignItems:'center',gap:'10px'}}><div className="wb-wrap"><div className="wb" style={{width:`${winPct}%`}}/></div><div style={{fontSize:'17px',fontWeight:'900',minWidth:'40px',textAlign:'right'}}>{winPct}%</div></div>
          <div style={{fontSize:'10px',color:'var(--tl)',marginTop:'5px'}}>{stats.played}試合中 {stats.wins}勝{stats.losses}敗</div>
        </div>}
        <div style={{padding:'0 12px 8px',fontSize:'12px',fontWeight:'700',color:'var(--ts)'}}>試合一覧</div>
        {bkEvs.map(ev=>{
          const b=normBK(ev.basketball);const mem=getMem(ev.memberId);
          const games=b?.games||[];
          // 勝敗サマリー
          let w=0,l=0,d=0;
          games.forEach(g=>{const r=getGameResult(g);if(r==='win')w++;else if(r==='lose')l++;else if(r==='draw')d++;});
          const hasResults=games.some(g=>g.myScore!==null&&g.myScore!==undefined);
          const vn=b?.venue&&venueNotes?.[b.venue];
          return(
            <div key={ev.id} className="bk-item" onClick={()=>setDetailEv(ev)}>
              <div className="bk-top">
                <div>
                  <div className="bk-tourn">{b?.tournamentName||'大会名未設定'}</div>
                  <div className="bk-title">{ev.title}</div>
                  {b?.venue&&<div style={{fontSize:'11px',color:'var(--ts)',marginTop:'3px'}}>📍 {b.venue}</div>}
                </div>
                <div style={{textAlign:'right'}}>
                  <div className="bk-date">{fmtJa(ev.date)}</div>
                  {mem&&<div style={{fontSize:'11px',color:mem.color,marginTop:'3px',fontWeight:'600'}}>{mem.emoji} {mem.name}</div>}
                  <div style={{fontSize:'11px',color:'var(--tl)',marginTop:'3px'}}>{games.length}試合</div>
                </div>
              </div>
              {/* 勝敗バッジ */}
              {hasResults&&<div style={{display:'flex',gap:'6px',flexWrap:'wrap',marginTop:'6px'}}>
                {w>0&&<span style={{background:'#16A34A',color:'#fff',borderRadius:'20px',padding:'2px 10px',fontSize:'11px',fontWeight:'700'}}>🏆 {w}勝</span>}
                {l>0&&<span style={{background:'#DC2626',color:'#fff',borderRadius:'20px',padding:'2px 10px',fontSize:'11px',fontWeight:'700'}}>😤 {l}敗</span>}
                {d>0&&<span style={{background:'var(--ts)',color:'#fff',borderRadius:'20px',padding:'2px 10px',fontSize:'11px',fontWeight:'700'}}>{d}引分</span>}
              </div>}
              {!hasResults&&<div style={{fontSize:'11px',color:'var(--tl)',marginTop:'4px'}}>スコア未登録</div>}
              {vn&&<div style={{fontSize:'11px',color:'#92400E',background:'#FFFBEB',border:'1px solid #FCD34D',borderRadius:'7px',padding:'6px 9px',marginTop:'9px'}}>📍 <strong>{b.venue}</strong>：{vn}</div>}
            </div>
          );
        })}
        <div style={{height:'8px'}}/>
      </>}

      {tab==='venues'&&<div style={{padding:'10px 12px'}}>
        {venueList.length===0&&<div style={{textAlign:'center',padding:'40px 20px',color:'var(--tl)',fontSize:'14px'}}>
          <div style={{fontSize:'40px',marginBottom:'12px'}}>📍</div>
          <div style={{fontWeight:'700',marginBottom:'8px'}}>会場メモがありません</div>
          <div style={{fontSize:'12px',lineHeight:'1.6'}}>試合を登録するときに会場名を入力すると、メモを保存できます。<br/>次回同じ会場が選ばれると自動で表示されます。</div>
        </div>}
        {venueList.map(([name,note])=>(
          <div key={name} style={{background:'#fff',borderRadius:'14px',padding:'14px',marginBottom:'10px',boxShadow:'0 1px 4px rgba(0,0,0,.07)'}}>
            {editVenue?.name===name
              ?<>
                <div style={{fontSize:'14px',fontWeight:'700',color:'var(--t)',marginBottom:'9px'}}>📍 {name}</div>
                <textarea className="fi" rows={4} value={editVenue.note} onChange={e=>setEditVenue({name,note:e.target.value})} style={{resize:'none',fontSize:'13px',margin:'0 0 8px'}} placeholder="トイレの場所、駐車場情報、独自ルールなど…"/>
                <div style={{display:'flex',gap:'8px'}}>
                  <button className="btn-p" style={{flex:1,margin:0,padding:'9px'}} onClick={()=>{onSaveVenueNote(name,editVenue.note);setEditVenue(null);}}>保存</button>
                  <button style={{flex:1,border:'1px solid var(--bd)',background:'#fff',borderRadius:'10px',padding:'9px',fontWeight:'700',fontSize:'14px',cursor:'pointer'}} onClick={()=>setEditVenue(null)}>キャンセル</button>
                </div>
              </>
              :<>
                <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:'8px'}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:'14px',fontWeight:'700',color:'var(--t)',marginBottom:'6px'}}>📍 {name}</div>
                    <div style={{fontSize:'13px',color:note?'var(--t)':'var(--tl)',whiteSpace:'pre-wrap',lineHeight:'1.7'}}>{note||'メモなし'}</div>
                  </div>
                  <button style={{border:'none',background:'var(--pl)',color:'var(--p)',borderRadius:'8px',padding:'5px 10px',fontSize:'12px',fontWeight:'700',cursor:'pointer',flexShrink:0}} onClick={()=>setEditVenue({name,note})}>編集</button>
                </div>
              </>
            }
          </div>
        ))}
      </div>}
    </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════
   IMPORT VIEW  (with full editable confirmation)
══════════════════════════════════════════════════ */
function ImportView({members,onAddEvents}){
  const[imgData,setImgData]=useState(null);
  const[text,setText]=useState('');
  const[loading,setLoading]=useState(false);
  const[pendingEvs,setPendingEvs]=useState(null);
  const[defaultMemberId,setDefaultMemberId]=useState(members[0]?.id||'');
  const[listening,setListening]=useState(false);
  const[interim,setInterim]=useState('');
  const[showOrigImg,setShowOrigImg]=useState(false);
  const[focusedEvIdx,setFocusedEvIdx]=useState(0);
  const[panOffset,setPanOffset]=useState({x:0,y:0});
  const[isPanning,setIsPanning]=useState(false);
  const fileRef=useRef();
  const srRef=useRef(null);
  const cardRefs=useRef([]);
  const obsRef=useRef(null);
  const panStartRef=useRef(null);

  const hasSpeech=!!(window.SpeechRecognition||window.webkitSpeechRecognition);

  // フォーカスカード切替時にパンオフセットをリセット
  useEffect(()=>{setPanOffset({x:0,y:0});},[focusedEvIdx]);

  // 分割表示中：スクロールで見えているカードを検知して画像をズーム
  useEffect(()=>{
    if(!showOrigImg||!pendingEvs?.length)return;
    if(obsRef.current)obsRef.current.disconnect();
    const ratios=new Array(pendingEvs.length).fill(0);
    const obs=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        const idx=parseInt(entry.target.dataset.evIdx||'0');
        if(!isNaN(idx))ratios[idx]=entry.intersectionRatio;
      });
      const max=Math.max(...ratios);
      if(max>0)setFocusedEvIdx(ratios.indexOf(max));
    },{threshold:[0,.1,.25,.5,.75,1],rootMargin:'-44% 0px -5% 0px'});
    obsRef.current=obs;
    cardRefs.current.forEach((el,i)=>{if(el){el.dataset.evIdx=String(i);obs.observe(el);}});
    return()=>obs.disconnect();
  },[showOrigImg,pendingEvs?.length]);

  const toggleVoice=()=>{
    if(listening){srRef.current?.stop();setListening(false);setInterim('');return;}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert('お使いのブラウザは音声入力に対応していません');return;}
    const sr=new SR();srRef.current=sr;
    sr.lang='ja-JP';sr.continuous=true;sr.interimResults=true;
    sr.onstart=()=>setListening(true);
    sr.onresult=e=>{
      let fin='',intr='';
      // resultIndex から処理することで過去の確定結果の重複追加を防ぐ
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal)fin+=e.results[i][0].transcript;
        else intr+=e.results[i][0].transcript;
      }
      if(fin){setText(prev=>(prev&&!prev.endsWith('\n')?prev+'\n':prev)+fin);setInterim('');}
      else setInterim(intr);
    };
    sr.onerror=e=>{setListening(false);setInterim('');if(e.error!=='aborted'&&e.error!=='no-speech')alert('音声認識エラー: '+e.error);};
    sr.onend=()=>{setListening(false);setInterim('');};
    sr.start();
  };

  const handleFile=file=>{if(!file)return;const r=new FileReader();r.onload=e=>setImgData(e.target.result);r.readAsDataURL(file);};
  const updateEv=(i,field,val)=>setPendingEvs(prev=>prev.map((e,j)=>j===i?{...e,[field]:val}:e));
  const updateEvMulti=(i,fields)=>setPendingEvs(prev=>prev.map((e,j)=>j===i?{...e,...fields}:e));
  const removeEv=i=>setPendingEvs(prev=>prev.filter((_,j)=>j!==i));
  const setAllMember=id=>setPendingEvs(prev=>prev.map(e=>({...e,memberId:id})));

  const parseWithAI=async()=>{
    const apiKey=S.get('appSettings',DEF_SETTINGS).apiKey;
    if(!apiKey){alert('設定画面でGemini APIキーを設定してください');return;}
    setLoading(true);
    // AI処理中は画面を暗くさせない（Wake Lock）
    let wakeLock=null;
    try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen');}catch(e){}
    try{
      const bboxNote=imgData?' bboxは各予定の画像内位置を0〜1の相対座標{x,y,w,h}で。':'';
      const prompt=`スケジュールに記載されている予定のみをJSON配列で返してください。空白・予定なしの日は含めないこと。\n形式: [{title,date(YYYY-MM-DD),startTime(HH:MM or null),endTime(HH:MM or null),notes${imgData?',bbox:{x,y,w,h}':''}}]\nルール:\n・予定が書かれている日だけを対象とする（空欄の日は除外）\n・同じ日に複数の予定があれば最も重要なもの1件だけを抽出\n・イベント名・大会名・試合名をtitleに。なければ会場名（例:若宮、博多体育館など）をtitleに\n・今年は${new Date().getFullYear()}年${bboxNote}\nJSONのみ返してください。`;
      const parts=[];
      if(imgData){
        const base64=imgData.split(',')[1];
        const mimeType=imgData.split(';')[0].split(':')[1];
        parts.push({inline_data:{mime_type:mimeType,data:base64}});
        parts.push({text:'この画像からスケジュールを読み取り'+prompt});
      } else {
        parts.push({text:`以下のテキストから予定を読み取り${prompt}\n${text}`});
      }
      const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
      const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:{temperature:0.1}})});
      const data=await res.json();
      if(data.error)throw new Error(data.error.message);
      const jsonStr=data.candidates[0].content.parts[0].text.match(/\[[\s\S]*\]/)?.[0];
      if(!jsonStr)throw new Error('スケジュールが見つかりませんでした');
      const arr=JSON.parse(jsonStr).map(e=>{
        let bbox=null;
        if(e.bbox&&typeof e.bbox==='object'){
          // Geminiが0-1000スケールで返す場合も正規化
          let{x=0,y=0,w=1,h=1}=e.bbox;
          const sc=(x>1||y>1||w>1||h>1)?1000:1;
          bbox={x:x/sc,y:y/sc,w:Math.max(w/sc,.05),h:Math.max(h/sc,.03)};
        }
        return{...e,id:uid(),memberId:defaultMemberId||members[0]?.id||'',bbox};
      });
      setFocusedEvIdx(0);
      setPendingEvs(arr);
    }catch(e){alert(`エラー: ${e.message}`);}
    finally{try{wakeLock?.release();}catch(e){}}
    setLoading(false);
  };

  const confirmAdd=()=>{
    const toAdd=pendingEvs.map(e=>({id:uid(),title:e.title||'予定',date:e.date||todayStr(),startTime:e.startTime||'',endTime:e.endTime||'',memberId:e.memberId||members[0]?.id||'',notes:e.notes||'',isBasketball:false,basketball:null,recurring:'none',recurGroupId:null,createdAt:new Date().toISOString()}));
    onAddEvents(toAdd);
    setPendingEvs(null);setImgData(null);setText('');
    alert(`✅ ${toAdd.length}件の予定を追加しました！`);
  };

  /* ── Confirmation screen ── */
  if(pendingEvs){
    return(
      <div>
        {/* ── 分割表示: 上に元画像（sticky固定・bbox自動ズーム＋手動パン）、下にスケジュール ── */}
        {showOrigImg&&imgData&&(()=>{
          const bbox=pendingEvs[focusedEvIdx]?.bbox;
          // background-image方式: objectFit:containのレターボックス問題を回避し下端まで正確にズーム
          const S=bbox?Math.min(Math.min(1/(bbox.w||.2),1/(bbox.h||.1))*.75,5):1;
          const cx=bbox?(bbox.x+bbox.w/2):.5;
          const cy=bbox?(bbox.y+bbox.h/2):.5;
          // background-position計算式: 任意の点(cx,cy)をコンテナ中央に持ってくる
          const bpx=S<=1?50:((cx*S-0.5)/(S-1))*100;
          const bpy=S<=1?50:((cy*S-0.5)/(S-1))*100;
          const bgStyle={
            backgroundImage:`url(${imgData})`,
            backgroundSize:`${(S*100).toFixed(0)}%`,
            backgroundRepeat:'no-repeat',
            backgroundPosition:`calc(${bpx.toFixed(1)}% + ${panOffset.x}px) calc(${bpy.toFixed(1)}% + ${panOffset.y}px)`,
            transition:isPanning?'none':'background-position .5s cubic-bezier(.4,0,.2,1), background-size .5s cubic-bezier(.4,0,.2,1)',
          };
          const label=pendingEvs[focusedEvIdx]?.title||'';
          const startPan=(cx,cy)=>{
            panStartRef.current={x:cx,y:cy,ox:panOffset.x,oy:panOffset.y};
            setIsPanning(true);
          };
          const movePan=(cx,cy)=>{
            if(!panStartRef.current)return;
            setPanOffset({x:panStartRef.current.ox+(cx-panStartRef.current.x),y:panStartRef.current.oy+(cy-panStartRef.current.y)});
          };
          const endPan=()=>{panStartRef.current=null;setIsPanning(false);};
          // タッチ
          const onPanStart=e=>{if(e.touches.length===1){startPan(e.touches[0].clientX,e.touches[0].clientY);}};
          const onPanMove=e=>{if(e.touches.length===1){movePan(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault();}};
          const onPanEnd=()=>endPan();
          // マウス（PC）
          const onMouseDown=e=>{startPan(e.clientX,e.clientY);};
          const onMouseMove=e=>{if(isPanning||panStartRef.current)movePan(e.clientX,e.clientY);};
          const onMouseUp=()=>endPan();
          const onMouseLeave=()=>{if(panStartRef.current)endPan();};
          return(
            <div style={{position:'sticky',top:0,zIndex:10,background:'#111',display:'flex',flexDirection:'column',height:'42vh',boxShadow:'0 2px 8px rgba(0,0,0,.3)'}}>
              <div
                style={{flex:1,minHeight:0,...bgStyle,touchAction:'none',cursor:isPanning?'grabbing':'grab',userSelect:'none'}}
                onTouchStart={onPanStart}
                onTouchMove={onPanMove}
                onTouchEnd={onPanEnd}
                onMouseDown={onMouseDown}
                onMouseMove={onMouseMove}
                onMouseUp={onMouseUp}
                onMouseLeave={onMouseLeave}>
                {/* ドラッグ可能ヒント（初期表示のみ） */}
                {!bbox&&<div style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',background:'rgba(0,0,0,.5)',color:'#fff',borderRadius:'8px',padding:'5px 10px',fontSize:'11px',fontWeight:'700',pointerEvents:'none',whiteSpace:'nowrap'}}>👆 ドラッグで位置調整</div>}
              </div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'5px 10px',background:'rgba(0,0,0,.78)',flexShrink:0,gap:'8px'}}>
                <div style={{display:'flex',alignItems:'center',gap:'6px',minWidth:0}}>
                  {bbox&&<span style={{background:'var(--p)',borderRadius:'5px',padding:'2px 7px',fontSize:'10px',fontWeight:'800',color:'#fff',flexShrink:0}}>🔍 {focusedEvIdx+1}/{pendingEvs.length}</span>}
                  <span style={{color:'rgba(255,255,255,.85)',fontSize:'11px',fontWeight:'700',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{label||'📷 元画像 — ドラッグで移動'}</span>
                </div>
                <button
                  onClick={()=>setShowOrigImg(false)}
                  onTouchEnd={e=>{e.preventDefault();e.stopPropagation();setShowOrigImg(false);}}
                  style={{border:'none',background:'rgba(255,255,255,.18)',color:'#fff',borderRadius:'8px',padding:'4px 10px',fontSize:'11px',fontWeight:'700',cursor:'pointer',touchAction:'manipulation',flexShrink:0}}>
                  ✕ 終了
                </button>
              </div>
            </div>
          );
        })()}

        <div className="ic-header">
          <button className="ic-back" onClick={()=>setPendingEvs(null)}>← 戻る</button>
          <div className="ic-info">
            <div className="ic-h">確認・編集</div>
            <div className="ic-sub">{pendingEvs.length}件の予定 — 内容を確認・修正してから追加</div>
          </div>
          {imgData&&!showOrigImg
            ? <button className="ic-add-btn"
                style={{background:'var(--ts)',fontSize:'11px',padding:'6px 10px'}}
                onClick={()=>setShowOrigImg(true)}
                onTouchEnd={e=>{e.preventDefault();e.stopPropagation();setShowOrigImg(true);}}>
                📷 照合
              </button>
            : <button className="ic-add-btn" onClick={confirmAdd}>追加する</button>
          }
        </div>
        {/* 分割表示中は「追加する」をヘッダー下に別途表示 */}
        {showOrigImg&&(
          <div style={{padding:'6px 12px 2px',display:'flex',gap:'8px'}}>
            <button className="ic-add-btn" onClick={confirmAdd} style={{flex:1,borderRadius:'10px',padding:'9px',fontSize:'13px'}}>✅ {pendingEvs.length}件を追加する</button>
          </div>
        )}

        {/* 全件一括メンバー変更 */}
        <div style={{padding:'6px 12px 2px',display:'flex',gap:'6px',flexWrap:'wrap',alignItems:'center'}}>
          <span style={{fontSize:'11px',color:'var(--tl)',fontWeight:'700',flexShrink:0}}>全件を：</span>
          {members.map(m=>(
            <button key={m.id} onClick={()=>setAllMember(m.id)}
              style={{padding:'4px 10px',borderRadius:'20px',border:'1.5px solid '+m.color,background:m.color+'22',color:m.color,fontSize:'11px',fontWeight:'700',cursor:'pointer',touchAction:'manipulation'}}>
              {m.emoji} {m.name}
            </button>
          ))}
        </div>

        <div style={{padding:'10px 0 4px'}}>
          {pendingEvs.map((ev,i)=>{
            const mem=members.find(m=>m.id===ev.memberId);
            const isFocused=showOrigImg&&focusedEvIdx===i;
            return(
              <div key={i} ref={el=>cardRefs.current[i]=el} className="ic-card"
                style={{borderLeftColor:mem?.color||'var(--p)',outline:isFocused?'2px solid var(--p)':'none',outlineOffset:'-2px',transition:'outline .3s'}}>
                {/* Title row */}
                <div className="ic-card-top">
                  <input className="ic-title-in" value={ev.title} onChange={e=>updateEv(i,'title',e.target.value)} placeholder="タイトル"/>
                  <button className="ic-del-btn" onClick={()=>removeEv(i)}>✕</button>
                </div>
                {/* Date/Time */}
                <div className="ic-row">
                  <input className="ic-fi" type="date" value={ev.date||''} onChange={e=>updateEv(i,'date',e.target.value)}/>
                  <input className="ic-fi" type="time" value={ev.startTime||''} onChange={e=>updateEv(i,'startTime',e.target.value)} style={{maxWidth:'90px'}}/>
                  <input className="ic-fi" type="time" value={ev.endTime||''} onChange={e=>updateEv(i,'endTime',e.target.value)} style={{maxWidth:'90px'}}/>
                </div>
                {/* 時間プリセット */}
                <div style={{display:'flex',gap:'5px',flexWrap:'wrap',marginTop:'4px'}}>
                  {(S.get('appSettings',DEF_SETTINGS).timePresets||DEF_TIME_PRESETS).map(p=>{
                    const applyPreset=()=>updateEvMulti(i,{startTime:p.start,endTime:p.end});
                    return(
                      <button key={p.id}
                        onClick={applyPreset}
                        onTouchEnd={e=>{e.preventDefault();e.stopPropagation();applyPreset();}}
                        style={{padding:'5px 11px',borderRadius:'14px',border:'1.5px solid var(--bd)',background:'#F8FAFC',color:'var(--ts)',fontSize:'11px',fontWeight:'700',cursor:'pointer',touchAction:'manipulation',WebkitTapHighlightColor:'rgba(0,0,0,.08)'}}>
                        {p.name}
                      </button>
                    );
                  })}
                </div>
                {/* Member selector */}
                <div className="ic-mem-row">
                  {members.map(m=>(
                    <div key={m.id} className={`ic-mem ${ev.memberId===m.id?'sel':''}`}
                      style={{background:ev.memberId===m.id?m.color+'22':'#F3F4F6',color:m.color}}
                      onClick={()=>updateEv(i,'memberId',m.id)}>
                      {m.emoji} {m.name}
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>

        <button className="btn-p" onClick={confirmAdd} style={{marginTop:'8px'}}>
          {pendingEvs.length}件をカレンダーに追加する
        </button>
        <div style={{height:'12px'}}/>
      </div>
    );
  }

  /* ── Input screen ── */
  return(
    <div>
      {/* ① 誰のスケジュールか事前選択 */}
      <div style={{padding:'12px 12px 4px'}}>
        <div style={{fontSize:'13px',fontWeight:'800',marginBottom:'8px',color:'var(--t)'}}>① 誰のスケジュールですか？</div>
        <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
          {members.map(m=>(
            <button key={m.id} onClick={()=>setDefaultMemberId(m.id)}
              style={{padding:'8px 14px',borderRadius:'20px',border:`2px solid ${m.color}`,background:defaultMemberId===m.id?m.color:m.color+'18',color:defaultMemberId===m.id?'#fff':m.color,fontSize:'13px',fontWeight:'700',cursor:'pointer',touchAction:'manipulation',transition:'all .15s'}}>
              {m.emoji} {m.name}
            </button>
          ))}
        </div>
      </div>

      <div style={{padding:'10px 12px 4px',fontSize:'13px',fontWeight:'800',color:'var(--t)'}}>② 予定を読み込む</div>

      <input ref={fileRef} type="file" accept="image/*" onChange={e=>handleFile(e.target.files[0])} style={{display:'none'}}/>
      <div className="import-zone" onClick={()=>fileRef.current.click()}>
        <div className="iz-icon">{imgData?'✅':'📷'}</div>
        <div className="iz-t">{imgData?'画像を選択済み':'写真・スクリーンショットを選ぶ'}</div>
        <div className="iz-sub">{imgData?'もう一度タップすると変更できます':'スケジュール表の写真や画面キャプチャ'}</div>
      </div>
      {imgData&&<div style={{padding:'0 12px 8px'}}>
        <img src={imgData} alt="選択画像" style={{width:'100%',maxHeight:'160px',objectFit:'contain',borderRadius:'12px',background:'#F3F4F6'}}/>
        <button className="btn-p" onClick={parseWithAI} disabled={loading} style={{marginTop:'10px'}}>{loading?'🔄 読み取り中...':'🤖 AIで読み取って確認画面へ'}</button>
      </div>}

      <div style={{display:'flex',alignItems:'center',gap:'10px',padding:'4px 12px 8px'}}>
        <div style={{flex:1,height:'1px',background:'var(--bd)'}}/>
        <span style={{fontSize:'12px',color:'var(--tl)'}}>または</span>
        <div style={{flex:1,height:'1px',background:'var(--bd)'}}/>
      </div>

      <div style={{padding:'0 12px 12px'}}>
        <div style={{fontSize:'13px',fontWeight:'700',marginBottom:'10px'}}>音声 または テキストで入力</div>

        {/* 音声入力ボタン */}
        {hasSpeech&&<>
          <button onClick={toggleVoice}
            style={{width:'100%',padding:'13px',borderRadius:'14px',border:'none',fontWeight:'800',fontSize:'15px',cursor:'pointer',touchAction:'manipulation',display:'flex',alignItems:'center',justifyContent:'center',gap:'10px',marginBottom:'10px',background:listening?'#FEE2E2':'var(--pl)',color:listening?'#DC2626':'var(--p)'}}>
            <span style={{fontSize:'22px'}}>{listening?'⏹':'🎤'}</span>
            {listening?'録音停止':'話して入力する'}
          </button>
          {listening&&<div style={{background:'#FEF2F2',border:'1.5px solid #FECACA',borderRadius:'10px',padding:'10px 13px',marginBottom:'8px',display:'flex',alignItems:'flex-start',gap:'8px'}}>
            <span style={{fontSize:'16px'}}>🔴</span>
            <div>
              <div style={{fontSize:'12px',fontWeight:'700',color:'#DC2626',marginBottom:'3px'}}>録音中 — 話し終わると自動で文字に変換します</div>
              <div style={{fontSize:'13px',color:'#7F1D1D',fontStyle:'italic',minHeight:'18px'}}>{interim||'🎙 話してください…'}</div>
            </div>
          </div>}
        </>}

        {/* テキスト入力 */}
        <div style={{fontSize:'12px',color:'var(--tl)',marginBottom:'6px'}}>{text?`${text.length}文字入力中`:'または直接テキストを貼り付け'}</div>
        <textarea className="fi" rows={5} placeholder={"例：\n4月25日(金) 10:00 市民体育大会\n4月26日(土) 9:00-17:00 試合\n「来週の土曜日、午前10時からぼたやま杯」でもOK"} value={text} onChange={e=>setText(e.target.value)} style={{resize:'none'}}/>
        {text.trim()&&<button onClick={()=>setText('')} style={{border:'none',background:'none',color:'var(--tl)',fontSize:'12px',padding:'4px 0',cursor:'pointer',touchAction:'manipulation'}}>✕ クリア</button>}
        <button className="btn-p" onClick={parseWithAI} disabled={loading||!text.trim()} style={{marginTop:'8px',width:'100%'}}>{loading?'🔄 読み取り中...':'🤖 AIで読み取って確認画面へ'}</button>
      </div>

      <div className="info-box">
        <div className="ib-t">💡 使い方</div>
        <div className="ib-b">① 写真またはテキストを入力 → ② AIが読み取り → <strong>③ 確認画面でタイトル・日付・メンバーを編集</strong> → ④ カレンダーに追加<br/><br/>設定画面で Gemini APIキーを設定するとAI読み取りが使えます（aistudio.google.com）。APIキーは無料で取得できます。</div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════
   SETTINGS VIEW
══════════════════════════════════════════════════ */
function SettingsView({members,setMembers,settings,setSettings,onPullSync,onPushSync,syncStatus,lastSynced}){
  const[showIconPicker,setShowIconPicker]=useState(false);
  const[editMem,setEditMem]=useState(null);
  const[mName,setMName]=useState('');const[mColor,setMColor]=useState(COLORS[0]);const[mEmoji,setMEmoji]=useState(EMOJIS[0]);
  const openAdd=()=>{setEditMem(false);setMName('');setMColor(COLORS[members.length%COLORS.length]);setMEmoji(EMOJIS[0]);}
  const openEdit=m=>{setEditMem(m);setMName(m.name);setMColor(m.color);setMEmoji(m.emoji);}
  const saveMem=()=>{if(!mName.trim())return;editMem?setMembers(p=>p.map(m=>m.id===editMem.id?{...m,name:mName,color:mColor,emoji:mEmoji}:m)):setMembers(p=>[...p,{id:uid(),name:mName,color:mColor,emoji:mEmoji}]);setEditMem(null);}
  const delMem=id=>{if(members.length<=1){alert('最低1人必要です');return;}if(confirm('削除しますか？'))setMembers(p=>p.filter(m=>m.id!==id));}
  const genIcon=emoji=>{try{const c=document.createElement('canvas');c.width=c.height=180;const ctx=c.getContext('2d');ctx.fillStyle='#5B5BF6';if(ctx.roundRect)ctx.roundRect(0,0,180,180,40);else ctx.rect(0,0,180,180);ctx.fill();ctx.font='100px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(emoji,90,95);return c.toDataURL('image/png');}catch{return '';}}
  useEffect(()=>{const el=document.getElementById('touch-icon');if(el)el.href=genIcon(settings.appIcon);const al=document.getElementById('apple-app-title');if(al)al.content=settings.appName;document.title=settings.appName;},[settings.appIcon,settings.appName]);
  const exportData=()=>{const data={events:S.get('events',[]),members:S.get('members',DEF_MEMBERS),diary:S.get('diary',{}),exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`famicale-${todayStr()}.json`;a.click();}
  return(
    <div>
      <div className="ss"><div className="ss-t">アプリ設定</div>
        <div className="sc">
          <div className="si" onClick={()=>setShowIconPicker(true)}><div className="si-ic" style={{fontSize:'26px'}}>{settings.appIcon}</div><div className="si-cnt"><div className="si-lb">アプリアイコン</div><div className="si-vl">ホーム画面のアイコンを変更</div></div><div className="si-ar">›</div></div>
          <div className="si" onClick={()=>{const n=prompt('アプリ名を入力',settings.appName);if(n?.trim())setSettings(p=>({...p,appName:n.trim()}));}}><div className="si-ic">📝</div><div className="si-cnt"><div className="si-lb">アプリ名</div><div className="si-vl">{settings.appName}</div></div><div className="si-ar">›</div></div>
        </div>
      </div>
      <div className="ss"><div className="ss-t">家族メンバー</div>
        <div className="sc">
          {members.map(m=>(
            <div key={m.id} className="mr">
              <div className="mav" style={{background:m.color+'22'}}>{m.emoji}</div>
              <div style={{flex:1}}><div style={{fontWeight:'700',fontSize:'14px'}}>{m.name}</div><div style={{width:'14px',height:'14px',borderRadius:'50%',background:m.color,marginTop:'3px'}}/></div>
              <button onClick={()=>openEdit(m)} style={{padding:'5px 11px',borderRadius:'8px',border:'1px solid var(--bd)',background:'transparent',cursor:'pointer',fontSize:'12px',color:'var(--ts)',marginRight:'5px'}}>編集</button>
              <button onClick={()=>delMem(m.id)} style={{padding:'5px 11px',borderRadius:'8px',border:'none',background:'transparent',cursor:'pointer',fontSize:'12px',color:'var(--danger)'}}>削除</button>
            </div>
          ))}
          <div className="si" onClick={openAdd}><div className="si-ic">➕</div><div className="si-cnt"><div className="si-lb" style={{color:'var(--p)'}}>メンバーを追加</div></div></div>
        </div>
      </div>
      {/* 時間プリセット設定 */}
      <div className="ss"><div className="ss-t">時間帯プリセット</div>
        <div className="sc" style={{padding:'14px'}}>
          <div style={{fontSize:'12px',color:'var(--ts)',marginBottom:'10px',lineHeight:'1.6'}}>予定入力時に選べる時間帯を設定できます。「終日」は時間なしで登録されます。</div>
          {(settings.timePresets||DEF_TIME_PRESETS).map((p,idx)=>(
            <div key={p.id} style={{display:'flex',gap:'6px',alignItems:'center',marginBottom:'8px'}}>
              <input className="fi" value={p.name} placeholder="名前" onChange={e=>setSettings(prev=>{const ps=[...(prev.timePresets||DEF_TIME_PRESETS)];ps[idx]={...ps[idx],name:e.target.value};return{...prev,timePresets:ps};})} style={{flex:'0 0 64px',textAlign:'center',padding:'7px 6px',fontSize:'13px',fontWeight:'700'}}/>
              <input className="fi" type="time" value={p.start} onChange={e=>setSettings(prev=>{const ps=[...(prev.timePresets||DEF_TIME_PRESETS)];ps[idx]={...ps[idx],start:e.target.value};return{...prev,timePresets:ps};})} style={{flex:1,padding:'7px 6px',fontSize:'13px'}}/>

              <button onClick={()=>setSettings(prev=>{const ps=(prev.timePresets||DEF_TIME_PRESETS).filter((_,j)=>j!==idx);return{...prev,timePresets:ps};})} style={{border:'none',background:'#FEE2E2',color:'#DC2626',borderRadius:'8px',padding:'7px 10px',cursor:'pointer',touchAction:'manipulation',flexShrink:0,fontWeight:'700'}}>✕</button>

          <button onClick={()=>setSettings(prev=>{const ps=[...(prev.timePresets||DEF_TIME_PRESETS),{id:uid(),name:'新しい時間帯',start:'',end:''}];return{...prev,timePresets:ps};})}
            style={{width:'100%',padding:'9px',border:'1.5px dashed var(--p)',borderRadius:'10px',background:'var(--pl)',color:'var(--p)',fontWeight:'700',fontSize:'13px',cursor:'pointer',touchAction:'manipulation',marginTop:'4px'}}>

          <input className="fi" type="password" placeholder="AIza..." value={settings.apiKey} onChange={e=>setSettings(p=>({...p,apiKey:e.target.value}))}/>
          <div style={{fontSize:'10px',color:'var(--tl)',marginTop:'5px',marginBottom:'10px'}}>このキーはお使いの端末内のみに保存されます</div>
          <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer"
            style={{display:'flex',alignItems:'center',gap:'8px',background:'#F0FDF4',border:'1.5px solid #86EFAC',borderRadius:'10px',padding:'10px 13px',textDecoration:'none',color:'#15803D'}}>
            <span style={{fontSize:'18px'}}>🔗</span>
            <div>
              <div style={{fontSize:'13px',fontWeight:'700'}}>Google AI Studio でAPIキーを取得</div>

        </div>
      </div>
      <div className="ss"><div className="ss-t">夫婦で共有する方法</div>
        <div className="sc" style={{padding:'14px'}}>
          <div style={{fontSize:'14px',fontWeight:'800',marginBottom:'11px'}}>🔄 設定手順</div>
          {[['① Netlify に登録','netlify.com で無料アカウントを作成'],['② HTMLをアップロード','このファイルをドラッグ＆ドロップしてURLを発行'],['③ URLを奥様と共有','Safariで開いて「ホーム画面に追加」'],['④ Firebase で同期（任意）','Firebaseを設定するとリアルタイムで同期']].map(([t,d])=>(
            <div key={t} style={{marginBottom:'10px'}}><div style={{fontSize:'13px',fontWeight:'700'}}>{t}</div><div style={{fontSize:'11px',color:'var(--ts)',marginTop:'1px',lineHeight:'1.5'}}>{d}</div></div>
          ))}
          <div style={{fontSize:'12px',color:'var(--p)',fontWeight:'700',marginTop:'4px'}}>💬 「同期の設定を手伝って」と話しかければ案内します</div>
        </div>
      </div>
      {/* ── Firebase 同期設定 ── */}
      <div className="ss"><div className="ss-t">☁️ カレンダー共有（Firebase同期）</div>
        <div className="sc" style={{padding:'14px'}}>
          <div style={{fontSize:'12px',color:'var(--ts)',marginBottom:'10px',lineHeight:'1.7'}}>
            設定すると家族間でリアルタイム同期されます。<strong>未設定の場合はこの端末のみで独立して動作します。</strong>
          </div>
          <div className="fg" style={{margin:'0 0 10px'}}>
            <label className="fl">Firebase プロジェクトID</label>
            <input className="fi" placeholder="例：family-cal-12345" value={settings.fbProjectId||''} onChange={e=>setSettings(p=>({...p,fbProjectId:e.target.value.trim()}))} style={{margin:0}}/>
            <div style={{fontSize:'10px',color:'var(--tl)',marginTop:'4px'}}>console.firebase.google.com → プロジェクト設定で確認</div>
          </div>
          <div className="fg" style={{margin:'0 0 12px'}}>
            <label className="fl">ファミリーコード（合言葉）</label>
            <input className="fi" placeholder="例：noguchi-family-2026" value={settings.familyCode||''} onChange={e=>setSettings(p=>({...p,familyCode:e.target.value.trim()}))} style={{margin:0}}/>
            <div style={{fontSize:'10px',color:'var(--tl)',marginTop:'4px'}}>家族全員が同じコードを入力すると同期されます（英数字・ハイフン推奨）</div>
          </div>
          {settings.fbProjectId&&settings.familyCode&&(
            <div style={{background:syncStatus==='error'?'#FEF2F2':syncStatus==='ok'?'#F0FDF4':'#F8FAFC',border:`1px solid ${syncStatus==='error'?'#FCA5A5':syncStatus==='ok'?'#86EFAC':'#E2E8F0'}`,borderRadius:'10px',padding:'10px 12px',marginBottom:'10px'}}>
              <div style={{fontSize:'12px',fontWeight:'700',color:syncStatus==='error'?'#DC2626':syncStatus==='ok'?'#16A34A':'var(--ts)',marginBottom:'6px'}}>
                {syncStatus==='syncing'?'🔄 同期中...':syncStatus==='ok'?'✅ 同期済み':syncStatus==='error'?'❌ 同期エラー':'⏸ 未同期'}
              </div>
              {lastSynced&&<div style={{fontSize:'11px',color:'var(--tl)'}}>最終同期: {lastSynced.toLocaleTimeString('ja-JP')}</div>}
              <div style={{display:'flex',gap:'8px',marginTop:'9px'}}>
                <button style={{flex:1,padding:'8px',border:'none',borderRadius:'8px',background:'var(--p)',color:'#fff',fontWeight:'700',fontSize:'12px',cursor:'pointer'}} onClick={onPullSync}>📥 受信（妻の変更を取得）</button>
                <button style={{flex:1,padding:'8px',border:'none',borderRadius:'8px',background:'#E0E7FF',color:'var(--p)',fontWeight:'700',fontSize:'12px',cursor:'pointer'}} onClick={onPushSync}>📤 送信（今すぐ同期）</button>
              </div>
            </div>
          )}
          <div style={{fontSize:'11px',color:'var(--tl)',lineHeight:'1.7',background:'#F8FAFC',borderRadius:'8px',padding:'8px 10px'}}>
            💡 <strong>セットアップ手順：</strong><br/>
            1. <a href="https://console.firebase.google.com" target="_blank" style={{color:'var(--p)'}}>Firebase Console</a> でプロジェクトを作成（無料）<br/>
            2. Realtime Database を有効化 → ルールを <code style={{background:'#E2E8F0',padding:'1px 4px',borderRadius:'3px'}}>".read":true,".write":true</code> に設定<br/>
            3. プロジェクトIDとファミリーコードを上記に入力<br/>
            4. 妻のスマホでも同じ設定をする → 完了！
          </div>
        </div>
      </div>
      <div className="ss"><div className="ss-t">データ管理</div>
        <div className="sc">
          <div className="si" onClick={exportData}><div className="si-ic">💾</div><div className="si-cnt"><div className="si-lb">データをバックアップ</div><div className="si-vl">JSONファイルとしてダウンロード</div></div><div className="si-ar">›</div></div>
        </div>
      </div>
      <div style={{height:'12px'}}/>
      {showIconPicker&&(
        <div className="overlay" onClick={()=>setShowIconPicker(false)}>
          <div className="sheet" onClick={e=>e.stopPropagation()}>
            <div className="s-handle"/><div className="s-hdr"><span className="s-title">アプリアイコン</span><button className="x-btn" onClick={()=>setShowIconPicker(false)}>✕</button></div>
            <div className="icon-grid">{APP_ICONS.map(ic=><div key={ic} className={`aio ${settings.appIcon===ic?'sel':''}`} style={{background:settings.appIcon===ic?'var(--p)':'#F3F4F6'}} onClick={()=>{setSettings(p=>({...p,appIcon:ic}));setShowIconPicker(false);}}>{ic}</div>)}</div>
            <div style={{padding:'0 20px 8px',fontSize:'11px',color:'var(--ts)'}}>ホーム画面に追加する際にこのアイコンが表示されます</div>
          </div>
        </div>
      )}
      {editMem!==null&&(
        <div className="overlay" onClick={()=>setEditMem(null)}>
          <div className="sheet" onClick={e=>e.stopPropagation()}>
            <div className="s-handle"/><div className="s-hdr"><span className="s-title">{editMem?'メンバーを編集':'メンバーを追加'}</span><button className="x-btn" onClick={()=>setEditMem(null)}>✕</button></div>
            <div className="fg"><label className="fl">名前</label><input className="fi" placeholder="名前を入力" value={mName} onChange={e=>setMName(e.target.value)} autoFocus/></div>
            <div className="fg"><label className="fl">絵文字</label></div>
            <div style={{display:'flex',flexWrap:'wrap',gap:'8px',padding:'0 20px 13px'}}>
              {EMOJIS.map(e=><div key={e} onClick={()=>setMEmoji(e)} style={{width:'40px',height:'40px',borderRadius:'10px',background:mEmoji===e?'var(--pl)':'var(--bg)',border:mEmoji===e?'2px solid var(--p)':'2px solid transparent',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'22px',cursor:'pointer'}}>{e}</div>)}
            </div>
            <div className="fg"><label className="fl">カラー</label></div>
            <div className="color-grid">{COLORS.map(c=><div key={c} className="cswatch" style={{background:c}} onClick={()=>setMColor(c)}>{mColor===c&&'✓'}</div>)}</div>
            <div style={{display:'flex',alignItems:'center',gap:'10px',padding:'4px 20px 13px'}}>
              <div style={{width:'38px',height:'38px',borderRadius:'50%',background:mColor,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px'}}>{mEmoji}</div>
              <span style={{fontWeight:'700',fontSize:'15px'}}>{mName||'名前未設定'}</span>
            </div>
            <button className="btn-p" onClick={saveMem}>保存する</button>
          </div>
        </div>
      )}

  );
}

/* ══════════════════════════════════════════════════
   APP
══════════════════════════════════════════════════ */
function App(){
  const[view,setView]=useState('calendar');
  const[events,setEvents]=useState(()=>S.get('events',[]));
  const[members,setMembers]=useState(()=>S.get('members',DEF_MEMBERS));
  const[settings,setSettings]=useState(()=>S.get('appSettings',DEF_SETTINGS));
  const[diary,setDiary]=useState(()=>S.get('diary',{}));
  const[venueNotes,setVenueNotes]=useState(()=>S.get('venueNotes',{}));
  const[dateColors,setDateColors]=useState(()=>S.get('dateColors',{}));
  const[modal,setModal]=useState(null);
  const[syncStatus,setSyncStatus]=useState(null); // null|'syncing'|'ok'|'error'
  const[lastSynced,setLastSynced]=useState(null);
  const syncTimerRef=React.useRef(null);
  const isPullingRef=React.useRef(false);
  // refs to always access latest state in async callbacks
  const stateRef=React.useRef({});
  stateRef.current={events,members,diary,venueNotes,dateColors,settings};

  useEffect(()=>S.set('events',events),[events]);
  useEffect(()=>S.set('members',members),[members]);
  useEffect(()=>S.set('appSettings',settings),[settings]);
  useEffect(()=>S.set('diary',diary),[diary]);
  useEffect(()=>S.set('venueNotes',venueNotes),[venueNotes]);
  useEffect(()=>S.set('dateColors',dateColors),[dateColors]);

  const setDateColor=(date,memberId)=>setDateColors(p=>{
    const n={...p};
    if(!memberId)delete n[date];
    else n[date]=memberId;
    return n;
  });

  /* ── Firebase Sync ── */
  const getFbUrl=()=>{
    const{fbProjectId,familyCode}=stateRef.current.settings;
    if(!fbProjectId?.trim()||!familyCode?.trim())return null;
    return`https://${fbProjectId.trim()}-default-rtdb.firebaseio.com/cal/${encodeURIComponent(familyCode.trim())}.json`;
  };

  const pullSync=async()=>{
    const url=getFbUrl();if(!url)return;
    setSyncStatus('syncing');
    isPullingRef.current=true;
    try{
      const res=await fetch(url+'?t='+Date.now());
      if(!res.ok)throw new Error('HTTP '+res.status);
      const remote=await res.json();
      if(remote&&typeof remote==='object'){
        if(Array.isArray(remote.events))setEvents(remote.events);
        if(Array.isArray(remote.members)&&remote.members.length>0)setMembers(remote.members);
        if(remote.diary&&typeof remote.diary==='object')setDiary(remote.diary);
        if(remote.venueNotes&&typeof remote.venueNotes==='object')setVenueNotes(remote.venueNotes);
        if(remote.dateColors&&typeof remote.dateColors==='object')setDateColors(remote.dateColors);
      }
      setSyncStatus('ok');setLastSynced(new Date());
    }catch(e){setSyncStatus('error');}
    finally{setTimeout(()=>{isPullingRef.current=false;},600);}
  };

  const pushSync=async()=>{
    const url=getFbUrl();if(!url)return;
    const{events:ev,members:me,diary:di,venueNotes:vn,dateColors:dc}=stateRef.current;
    setSyncStatus('syncing');
    try{
      const res=await fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({events:ev,members:me,diary:di,venueNotes:vn,dateColors:dc,syncedAt:Date.now()})});
      if(!res.ok)throw new Error('HTTP '+res.status);
      setSyncStatus('ok');setLastSynced(new Date());
    }catch(e){setSyncStatus('error');}
  };

  // Pull on mount / when Firebase settings change / window focus
  useEffect(()=>{
    const{fbProjectId,familyCode}=settings;
    if(!fbProjectId?.trim()||!familyCode?.trim()){setSyncStatus(null);return;}
    pullSync();
    const onFocus=()=>pullSync();
    window.addEventListener('focus',onFocus);
    return()=>window.removeEventListener('focus',onFocus);
  },[settings.fbProjectId,settings.familyCode]);

  // Debounced push on data change (5s after last change)
  useEffect(()=>{
    if(isPullingRef.current)return;
    if(!getFbUrl())return;
    if(syncTimerRef.current)clearTimeout(syncTimerRef.current);
    syncTimerRef.current=setTimeout(pushSync,5000);
    return()=>{if(syncTimerRef.current)clearTimeout(syncTimerRef.current);};
  },[events,members,diary,venueNotes,dateColors]);

  const saveVenueNote=(name,note)=>{
    setVenueNotes(prev=>{
      if(!name.trim())return prev;
      if(!note.trim()){const n={...prev};delete n[name];return n;}
      return {...prev,[name]:note.trim()};
    });
  };

  useEffect(()=>{
    const m={name:settings.appName,short_name:settings.appName,start_url:'./',display:'standalone',background_color:'#ffffff',theme_color:'#5B5BF6',orientation:'portrait'};
    const blob=new Blob([JSON.stringify(m)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const el=document.getElementById('manifest-link');if(el)el.href=url;
    return()=>URL.revokeObjectURL(url);
  },[settings.appName]);

  const saveEvent=(ev,recurOpts)=>{
    if(recurOpts&&recurOpts.freq!=='none'&&recurOpts.endDate){
      const dates=generateRecurDates(ev.date,recurOpts.freq,recurOpts.endDate);
      const groupId=uid();
      const evs=dates.map(date=>({...ev,id:uid(),date,recurGroupId:groupId}));
      setEvents(prev=>[...prev.filter(e=>e.recurGroupId!==ev.recurGroupId||!ev.recurGroupId),...evs]);
    }else{
      setEvents(prev=>{const i=prev.findIndex(e=>e.id===ev.id);return i>=0?prev.map(e=>e.id===ev.id?ev:e):[...prev,ev];});
    }
    setModal(null);
  };

  const delEvent=id=>{
    const ev=events.find(e=>e.id===id);
    if(ev?.recurGroupId){
      const choice=confirm(`繰り返し予定です\n\n「OK」→ この予定のみ削除\n「キャンセル」→ すべての繰り返しを削除`);
      if(choice)setEvents(prev=>prev.filter(e=>e.id!==id));
      else setEvents(prev=>prev.filter(e=>e.recurGroupId!==ev.recurGroupId));
    }else{
      setEvents(prev=>prev.filter(e=>e.id!==id));
    }
    setModal(null);
  };

  // 複数削除
  const delEvents=ids=>{setEvents(prev=>prev.filter(e=>!ids.has(e.id)));};

  const diaryCount=Object.values(diary).filter(v=>v?.trim()).length;
  const navItems=[
    {id:'calendar',icon:'📅',label:'カレンダー',cls:''},
    {id:'diary',icon:'📔',label:'日記',cls:'dnav'},
    {id:'basketball',icon:'🏀',label:'バスケ',cls:''},
    {id:'import',icon:'📥',label:'インポート',cls:''},
    {id:'settings',icon:'⚙️',label:'設定',cls:''},
  ];

  return(
    <div className="shell">
      <div className="safe-top"/>
      <div className="hdr">
        <div className="hdr-title"><span>{settings.appIcon}</span><span>{settings.appName}</span></div>
        <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
          {syncStatus==='syncing'&&<span style={{fontSize:'11px',color:'var(--ts)',animation:'spin 1s linear infinite',display:'inline-block'}}>🔄</span>}
          {syncStatus==='ok'&&lastSynced&&<span style={{fontSize:'10px',color:'#16A34A',fontWeight:'600'}} title={`最終同期: ${lastSynced.toLocaleTimeString('ja-JP')}`}>☁️ 同期済</span>}
          {syncStatus==='error'&&<span style={{fontSize:'10px',color:'#DC2626',fontWeight:'600',cursor:'pointer'}} onClick={pushSync} title="タップして再試行">⚠️ 同期失敗</span>}
          {view==='diary'&&diaryCount>0&&<span style={{fontSize:'11px',color:'var(--d)',fontWeight:'700'}}>{diaryCount}件</span>}
          {view==='calendar'&&(
            <button onClick={()=>setModal({initDate:todayStr()})}
              style={{border:'none',background:'var(--pl)',color:'var(--p)',borderRadius:'20px',padding:'6px 13px',fontWeight:'700',fontSize:'13px',cursor:'pointer'}}>
              ＋追加
            </button>
          )}
        </div>
      </div>

      <div className="content">
        {view==='calendar'&&<CalendarView events={events} members={members} diary={diary} dateColors={dateColors} onSetDateColor={setDateColor} onDiaryChange={(d,t)=>setDiary(p=>({...p,[d]:t}))} onAdd={(date,time)=>setModal({initDate:date,initTime:time})} onEdit={ev=>setModal({event:ev,initDate:ev.date})} onDeleteMultiple={delEvents}/>}
        {view==='diary'&&<DiaryView diary={diary} onDiaryChange={(d,t)=>setDiary(p=>({...p,[d]:t}))}/>}
        {view==='basketball'&&<BasketballView events={events} members={members} onEdit={ev=>setModal({event:ev,initDate:ev.date})} venueNotes={venueNotes} onSaveVenueNote={saveVenueNote}/>}
        {view==='import'&&<ImportView members={members} onAddEvents={evs=>setEvents(p=>[...p,...evs])}/>}
        {view==='settings'&&<SettingsView members={members} setMembers={setMembers} settings={settings} setSettings={setSettings} onPullSync={pullSync} onPushSync={pushSync} syncStatus={syncStatus} lastSynced={lastSynced}/>}
      </div>

      <nav className="bnav">
        {navItems.map(n=>(
          <button key={n.id} className={`ni ${view===n.id?'on':''} ${n.cls}`} onClick={()=>setView(n.id)}>
            <span className="ni-ic">{n.icon}</span>
            <span className="ni-lb">{n.label}</span>
          </button>
        ))}
      </nav>

      {modal&&<EventModal
        event={modal.event} members={members}
        initDate={modal.initDate}
        onSave={saveEvent} onDelete={delEvent}
        onClose={()=>setModal(null)}
        venueNotes={venueNotes} onSaveVenueNote={saveVenueNote}
        timePresets={settings.timePresets||DEF_TIME_PRESETS}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
