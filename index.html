<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>バ・スケ</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" id="apple-app-title" content="バ・スケ">
  <meta name="theme-color" content="#5B5BF6">
  <link rel="manifest" id="manifest-link">
  <link rel="apple-touch-icon" id="touch-icon" sizes="512x512">
  <script>
    // ホーム画面アイコンをページ読み込み直後に生成（iOS対応）
    (function(){
      try{
        var s=JSON.parse(localStorage.getItem('appSettings')||'{}');
        var emoji=s.appIcon||'🏀';
        var name=s.appName||'バ・スケ';
        var c=document.createElement('canvas');
        c.width=c.height=512;
        var ctx=c.getContext('2d');
        // グラデーション背景
        // ティールグリーン背景（Cパターン）
        var grad=ctx.createLinearGradient(0,0,0,512);
        grad.addColorStop(0,'#5BD4C0');
        grad.addColorStop(1,'#2AB5A0');
        ctx.fillStyle=grad;
        if(ctx.roundRect)ctx.roundRect(0,0,512,512,110);
        else ctx.rect(0,0,512,512);
        ctx.fill();
        // 白いボーダーライン
        ctx.strokeStyle='rgba(255,255,255,0.55)';
        ctx.lineWidth=14;
        ctx.beginPath();
        if(ctx.roundRect)ctx.roundRect(18,18,476,476,96);
        else ctx.rect(18,18,476,476);
        ctx.stroke();
        // テキスト背景帯（先に描いてボール位置を計算）
        var bandY=318,bandH=162;
        ctx.fillStyle='rgba(0,0,0,0.20)';
        ctx.beginPath();
        if(ctx.roundRect)ctx.roundRect(24,bandY,464,bandH,28);
        else ctx.rect(24,bandY,464,bandH);
        ctx.fill();
        // バスケットボール絵文字（帯より上の空間の中央）
        var topCenter=bandY*0.68; // 帯より上の空間の68%（下寄り）
        ctx.font='220px serif';
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.fillText(emoji,256,topCenter);
        // アプリ名テキスト
        ctx.fillStyle='#ffffff';
        ctx.font='bold 90px -apple-system,Helvetica,sans-serif';
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.fillText(name,256,bandY+bandH/2);
        var dataUrl=c.toDataURL('image/png');
        var link=document.getElementById('touch-icon');
        if(link)link.href=dataUrl;
        document.title=name;
        var tm=document.getElementById('apple-app-title');
        if(tm)tm.content=name;
      }catch(e){}
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --p:#5B5BF6; --pd:#4338CA; --pl:#EEF2FF; --danger:#EF4444; --ok:#10B981;
      --d:#F59E0B; --dl:#FFFBEB; --bg:#F2F3F7; --card:#fff;
      --t:#111827; --ts:#6B7280; --tl:#9CA3AF; --bd:#E5E7EB;
      --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    html,body,#root{height:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;background:var(--bg);color:var(--t);-webkit-font-smoothing:antialiased}
    .shell{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;background:var(--bg)}
    .safe-top{height:var(--safe-top);background:#fff;flex-shrink:0}
    .hdr{background:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);min-height:52px;flex-shrink:0}
    .hdr-title{font-size:19px;font-weight:800;color:var(--p);display:flex;align-items:center;gap:6px}
    .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(70px + var(--safe-bottom))}
    .content::-webkit-scrollbar{display:none}
    .bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--bd);padding:5px 0 calc(5px + var(--safe-bottom));display:flex;z-index:100}
    .ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 0;background:none;border:none;cursor:pointer;color:var(--tl);transition:color .15s}
    .ni.on{color:var(--p)}.ni.on.dnav{color:var(--d)}
    .ni-ic{font-size:19px;line-height:1}.ni-lb{font-size:9px;font-weight:700}

    /* ── View Toggle ── */
    .view-toggle{display:flex;gap:2px;background:var(--bg);padding:2px;border-radius:10px}
    .vbtn{padding:5px 12px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;color:var(--ts);background:transparent;transition:all .15s;font-family:inherit}
    .vbtn.on{background:#fff;color:var(--p);box-shadow:0 1px 3px rgba(0,0,0,.12)}

    /* ── Month View ── */
    .cal-wrap{padding:0 12px}
    .cal-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 10px}
    .cal-nav h2{font-size:21px;font-weight:800}
    .cal-nav-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--pl);color:var(--p);font-size:20px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
    .dh{text-align:center;font-size:10px;font-weight:700;color:var(--ts);padding:3px 0 8px}
    .dh.sun{color:#EF4444}.dh.sat{color:#3B82F6}
    .dc{display:flex;flex-direction:column;align-items:center;padding:2px 1px;cursor:pointer;border-radius:10px;transition:background .1s;min-height:48px}
    .dc:active{background:var(--pl)}.dc.other{opacity:.3}
    .dn{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
    .dc.today:not(.sel) .dn{border:2.5px solid var(--p);color:var(--p);font-weight:700}
    .dc.sel .dn{background:var(--p);color:#fff;font-weight:700}
    .dc.suncol:not(.sel) .dn{color:#EF4444}.dc.satcol:not(.sel) .dn{color:#3B82F6}
    .dc.holiday:not(.sel) .dn{color:#EF4444}
    .dc.marked:active{background:var(--pl)}
    .dots{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;min-height:9px;padding:1px 2px}
    .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
    .dot-d{width:6px;height:6px;border-radius:2px;background:var(--d);flex-shrink:0}

    /* ── Week View ── */
    .wk-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
    .wk-nav h2{font-size:17px;font-weight:800}
    .wk-hdr{display:grid;grid-template-columns:40px repeat(7,1fr);background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
    .wk-hdr-empty{width:40px}
    .wk-dhdr{text-align:center;padding:6px 2px 8px;cursor:pointer}
    .wk-dhdr:active{background:var(--pl)}
    .wk-dhdr-name{font-size:10px;font-weight:700;color:var(--ts)}
    .wk-dhdr-name.sun{color:#EF4444}.wk-dhdr-name.sat{color:#3B82F6}
    .wk-dhdr-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;margin:2px auto 0}
    .wk-dhdr-num.today{background:var(--p);color:#fff;font-weight:800}
    .wk-dhdr-num.sel:not(.today){border:2px solid var(--p);color:var(--p);font-weight:700}
    .wk-dhdr-num.suncol:not(.today):not(.sel){color:#EF4444}
    .wk-dhdr-num.satcol:not(.today):not(.sel){color:#3B82F6}
    .wk-dhdr-num.holiday:not(.today):not(.sel){color:#EF4444}
    .date-mark-row{display:flex;align-items:center;gap:6px;padding:4px 0 8px;flex-wrap:wrap}
    .date-mark-row .lbl{font-size:11px;color:var(--ts);font-weight:700}
    .date-mark-row .sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;padding:0;background:#fff;transition:transform .1s}
    .date-mark-row .sw:active{transform:scale(.92)}
    .date-mark-row .sw.none{border:1.5px dashed var(--bd);color:var(--tl);font-size:14px}
    .date-mark-row .sw.on{border-color:currentColor;box-shadow:0 0 0 1px #fff inset}
    .date-mark-row .sw.none.on{border-color:var(--p);color:var(--p)}
    .holiday-tag{color:#EF4444;font-size:11px;font-weight:800;margin-left:6px;background:#FEF2F2;border:1px solid #FECACA;border-radius:6px;padding:1px 6px}
    .wk-allday{display:grid;grid-template-columns:40px repeat(7,1fr);border-bottom:1px solid var(--bd);min-height:24px;background:#fff}
    .wk-allday-lbl{display:flex;align-items:center;justify-content:flex-end;padding-right:4px;font-size:9px;color:var(--tl);font-weight:600}
    .wk-allday-cell{border-left:1px solid var(--bd);padding:2px 1px;min-height:24px}
    .wk-allday-ev{border-radius:3px;padding:1px 3px;font-size:9px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:1px}
    .wk-body{overflow-y:auto;-webkit-overflow-scrolling:touch}
    .wk-body::-webkit-scrollbar{display:none}
    .wk-grid{display:grid;grid-template-columns:40px repeat(7,1fr)}
    .wk-time-col{position:relative}
    .wk-time-lbl{position:absolute;right:3px;font-size:9px;color:var(--tl);transform:translateY(-50%);white-space:nowrap;pointer-events:none}
    .wk-day-col{position:relative;border-left:1px solid var(--bd);cursor:pointer}
    .wk-day-col:active{background:rgba(91,91,246,.04)}
    .wk-h-line{position:absolute;left:0;right:0;height:1px;background:var(--bd);pointer-events:none}
    .wk-hh-line{position:absolute;left:0;right:0;height:1px;background:rgba(229,231,235,.6);pointer-events:none}
    .wk-ev{position:absolute;border-radius:5px;padding:2px 3px;overflow:hidden;cursor:pointer;opacity:.93;transition:opacity .1s;z-index:1}
    .wk-ev:active{opacity:1;z-index:2}
    .wk-ev-t{font-size:9px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
    .wk-ev-sub{font-size:8px;color:rgba(255,255,255,.85);line-height:1.2}
    .now-line{position:absolute;left:0;right:0;height:2px;background:#EF4444;z-index:3;pointer-events:none}
    .now-dot{position:absolute;width:8px;height:8px;border-radius:50%;background:#EF4444;top:-3px;left:-1px}

    /* ── Day View ── */
    .dv-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
    .dv-title-block{text-align:center}
    .dv-title{font-size:20px;font-weight:800}
    .dv-sub{font-size:12px;color:var(--ts);margin-top:1px}
    .dv-nav-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--pl);color:var(--p);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:bold}
    .dv-allday{padding:6px 12px;border-bottom:1px solid var(--bd);background:#fff}
    .dv-allday-ev{background:var(--pl);color:var(--p);border-radius:8px;padding:7px 12px;margin-bottom:5px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
    .dv-allday-ev:active{opacity:.8}
    .dv-body{display:grid;grid-template-columns:50px 1fr;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .dv-body::-webkit-scrollbar{display:none}
    .dv-time-col{position:relative}
    .dv-time-lbl{position:absolute;right:6px;font-size:10px;color:var(--tl);transform:translateY(-50%);white-space:nowrap;pointer-events:none}
    .dv-col{position:relative;border-left:1px solid var(--bd);cursor:pointer}
    .dv-col:active{background:rgba(91,91,246,.03)}
    .dv-h-line{position:absolute;left:-50px;right:0;height:1px;background:var(--bd);pointer-events:none}
    .dv-hh-line{position:absolute;left:-50px;right:0;height:1px;background:rgba(229,231,235,.6);pointer-events:none}
    .dv-ev{position:absolute;left:6px;right:6px;border-radius:12px;padding:8px 10px;cursor:pointer;overflow:hidden;z-index:1}
    .dv-ev:active{opacity:.85;z-index:2}
    .dv-ev-t{font-size:14px;font-weight:700;color:#fff;line-height:1.3}
    .dv-ev-sub{font-size:11px;color:rgba(255,255,255,.85);margin-top:2px}
    .dv-ev-mem{font-size:11px;color:rgba(255,255,255,.8);margin-top:2px}

    /* ── Day events list (month view) ── */
    .ev-sec{padding:4px 12px 0}
    .sec-t{font-size:12px;font-weight:700;color:var(--ts);padding:10px 4px 7px}
    .ev-item{background:#fff;border-radius:14px;padding:11px 13px;margin-bottom:7px;display:flex;align-items:flex-start;gap:9px;box-shadow:0 1px 3px rgba(0,0,0,.07);cursor:pointer}
    .ev-item:active{opacity:.7}
    .ev-bar{width:4px;border-radius:2px;align-self:stretch;min-height:30px;flex-shrink:0}
    .ev-main{flex:1;min-width:0}
    .ev-t{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ev-sub{font-size:11px;color:var(--ts);margin-top:3px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    .ev-badge{font-size:9px;padding:2px 6px;border-radius:10px;font-weight:700;background:#EDE9FE;color:#7C3AED}
    .ev-recur-badge{font-size:9px;padding:2px 6px;border-radius:10px;font-weight:700;background:#DCFCE7;color:#16A34A}
    .ev-arrow{color:var(--tl);font-size:16px;align-self:center}

    /* ── Diary (calendar inline) ── */
    .diary-sec{padding:0 12px 20px}
    .diary-hdr{display:flex;align-items:center;gap:7px;padding:10px 4px 8px}
    .diary-title{font-size:12px;font-weight:700;color:var(--d)}
    .diary-ta{width:100%;min-height:110px;padding:12px 14px;border:1.5px solid #FDE68A;border-radius:14px;font-size:15px;font-family:inherit;line-height:1.75;background:var(--dl);color:var(--t);outline:none;resize:none;-webkit-appearance:none}
    .diary-ta:focus{border-color:var(--d);background:#fff}
    .diary-ta::placeholder{color:#D1B860}

    /* ── FAB ── */
    .fab{position:fixed;bottom:calc(70px + var(--safe-bottom) + 14px);right:18px;width:52px;height:52px;border-radius:50%;background:var(--p);color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 16px rgba(91,91,246,.42);display:flex;align-items:center;justify-content:center;z-index:90;transition:transform .15s}
    .fab:active{transform:scale(.93)}

    /* ── Overlay / Sheet ── */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s ease;padding-top:calc(var(--safe-top) + 60px)}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:430px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(20px + var(--safe-bottom));animation:slideUp .22s ease-out}
    .sheet::-webkit-scrollbar{display:none}
    @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .s-handle{width:36px;height:4px;background:#D1D5DB;border-radius:2px;margin:12px auto 4px}
    .s-hdr{position:sticky;top:0;z-index:10;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px 14px;border-bottom:1px solid var(--bd)}
    .s-title{font-size:18px;font-weight:800}
    .x-btn{width:44px;height:44px;border-radius:50%;background:var(--bg);border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--ts);touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,.08);flex-shrink:0}

    /* ── Form ── */
    .fg{padding:0 20px 13px}
    .fl{font-size:10px;font-weight:700;color:var(--ts);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.5px}
    .fi{width:100%;padding:11px 13px;border:1.5px solid var(--bd);border-radius:12px;font-size:16px;font-family:inherit;background:var(--bg);color:var(--t);outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none}
    .fi:focus{border-color:var(--p);background:#fff}
    .fi::placeholder{color:var(--tl)}
    .fr{display:flex;gap:10px;padding:0 20px 13px}
    .fr .fg{flex:1;padding:0}
    .divider{height:1px;background:var(--bd);margin:4px 20px}
    .btn-p{display:block;width:calc(100% - 40px);margin:12px 20px;padding:14px;background:var(--p);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:opacity .15s}
    .btn-p:active{opacity:.85}.btn-danger{background:var(--danger)}.btn-outline{background:#fff;color:var(--p);border:2px solid var(--p)}
    .tog-row{display:flex;align-items:center;justify-content:space-between;padding:11px 20px;cursor:pointer}
    .tog-lbl{font-size:15px;font-weight:600}.tog-sub{font-size:12px;color:var(--ts);margin-top:2px}
    .tog{width:50px;height:28px;border-radius:14px;background:var(--bd);position:relative;transition:background .2s;flex-shrink:0}
    .tog.on{background:var(--p)}
    .tog-thumb{width:24px;height:24px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
    .tog.on .tog-thumb{left:24px}
    .mem-chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 13px}
    .mem-chip{display:flex;align-items:center;gap:5px;padding:7px 13px;border-radius:20px;border:2px solid transparent;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
    .mem-chip.sel{border-color:currentColor}
    .color-grid{display:flex;flex-wrap:wrap;gap:10px;padding:0 20px 13px}
    .cswatch{width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;font-weight:bold;transition:transform .1s}
    .cswatch:active{transform:scale(1.2)}

    /* ── Recurring chips ── */
    .recur-chips{display:flex;gap:7px;flex-wrap:wrap;padding:0 20px 13px}
    .recur-chip{padding:7px 13px;border-radius:20px;border:2px solid var(--bd);cursor:pointer;font-size:13px;font-weight:600;color:var(--ts);transition:all .15s;background:transparent}
    .recur-chip.sel{border-color:var(--p);background:var(--pl);color:var(--p)}

    /* ── Import ── */
    .import-zone{border:2.5px dashed var(--bd);border-radius:16px;padding:28px 16px;text-align:center;margin:12px;cursor:pointer;transition:all .15s}
    .import-zone:active{border-color:var(--p);background:var(--pl)}
    .iz-icon{font-size:48px;margin-bottom:9px}.iz-t{font-size:16px;font-weight:700;margin-bottom:3px}.iz-sub{font-size:12px;color:var(--ts)}
    .info-box{margin:0 12px 14px;padding:13px;background:var(--pl);border-radius:13px}
    .ib-t{font-size:12px;font-weight:700;color:var(--p);margin-bottom:5px}.ib-b{font-size:12px;color:#4338CA;line-height:1.6}

    /* ── Import Confirm Cards ── */
    .ic-header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd);background:#fff;position:sticky;top:0;z-index:5}
    .ic-back{border:none;background:var(--pl);color:var(--p);border-radius:10px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
    .ic-info{flex:1}
    .ic-h{font-size:16px;font-weight:800}
    .ic-sub{font-size:12px;color:var(--ts);margin-top:1px}
    .ic-add-btn{border:none;background:var(--p);color:#fff;border-radius:10px;padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
    .ic-card{background:#fff;border-radius:16px;padding:14px 16px;margin:0 12px 10px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-left:4px solid var(--p)}
    .ic-card-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .ic-title-in{flex:1;padding:7px 10px;border:1.5px solid var(--bd);border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;background:var(--bg);color:var(--t);outline:none}
    .ic-title-in:focus{border-color:var(--p);background:#fff}
    .ic-del-btn{width:28px;height:28px;border-radius:50%;border:none;background:#FEE2E2;color:#DC2626;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .ic-row{display:flex;gap:8px;margin-bottom:10px}

/* ── CONSTANTS ── */
const DAYS=['日','月','火','水','木','金','土'];
const MONTHS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

const APP_ICONS=['🏀','🗓️','🌟','🏠','🌸','⭐','🌈','🦁','🐱','🎯','💫','🎪','🌊','🍀'];
const RECUR_OPTS=[{v:'none',l:'繰り返さない'},{v:'weekly',l:'毎週'},{v:'biweekly',l:'隔週'},{v:'monthly',l:'毎月'}];
const HOUR_H = 52;   // px per hour in week/day views
const START_H = 6;   // start hour
const END_H = 22;    // end hour

// 日本の祝日（2024-2027）。春分/秋分は実測値、それ以外は法定。
const JP_HOLIDAYS={
  '2024-01-01':'元日','2024-01-08':'成人の日','2024-02-11':'建国記念の日','2024-02-12':'振替休日','2024-02-23':'天皇誕生日','2024-03-20':'春分の日','2024-04-29':'昭和の日','2024-05-03':'憲法記念日','2024-05-04':'みどりの日','2024-05-05':'こどもの日','2024-05-06':'振替休日','2024-07-15':'海の日','2024-08-11':'山の日','2024-08-12':'振替休日','2024-09-16':'敬老の日','2024-09-22':'秋分の日','2024-09-23':'振替休日','2024-10-14':'スポーツの日','2024-11-03':'文化の日','2024-11-04':'振替休日','2024-11-23':'勤労感謝の日',

  '2026-01-01':'元日','2026-01-12':'成人の日','2026-02-11':'建国記念の日','2026-02-23':'天皇誕生日','2026-03-20':'春分の日','2026-04-29':'昭和の日','2026-05-03':'憲法記念日','2026-05-04':'みどりの日','2026-05-05':'こどもの日','2026-05-06':'振替休日','2026-07-20':'海の日','2026-08-11':'山の日','2026-09-21':'敬老の日','2026-09-22':'国民の休日','2026-09-23':'秋分の日','2026-10-12':'スポーツの日','2026-11-03':'文化の日','2026-11-23':'勤労感謝の日',
  '2027-01-01':'元日','2027-01-11':'成人の日','2027-02-11':'建国記念の日','2027-02-23':'天皇誕生日','2027-03-21':'春分の日','2027-03-22':'振替休日','2027-04-29':'昭和の日','2027-05-03':'憲法記念日','2027-05-04':'みどりの日','2027-05-05':'こどもの日','2027-07-19':'海の日','2027-08-11':'山の日','2027-09-20':'敬老の日','2027-09-23':'秋分の日','2027-10-11':'スポーツの日','2027-11-03':'文化の日','2027-11-23':'勤労感謝の日',
};
const isHoliday=date=>JP_HOLIDAYS[date]||null;
const lightenColor=(hex,alpha=0.22)=>{
  if(!hex||hex[0]!=='#'||hex.length<7)return null;
  const n=parseInt(hex.slice(1,7),16);
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return `rgba(${r},${g},${b},${alpha})`;
};

/* ── UTILS ── */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>{const dt=d instanceof Date?d:new Date(d);return`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`};
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayStr=()=>fmt(new Date());
const fmtJa=s=>{const d=parseD(s);return`${d.getMonth()+1}月${d.getDate()}日(${DAYS[d.getDay()]})`};
const fmtMonJa=s=>{const d=parseD(s);return`${d.getFullYear()}年 ${d.getMonth()+1}月`};
const timeToMin=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m};
const minToTime=n=>`${pad(Math.floor(n/60))}:${pad(n%60)}`;

const monthDays=(y,m)=>{
  const days=[];
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  for(let i=0;i<first.getDay();i++){const dt=new Date(y,m,-first.getDay()+i+1);days.push({date:fmt(dt),cur:false});}
  for(let d=1;d<=last.getDate();d++)days.push({date:fmt(new Date(y,m,d)),cur:true});
  const rem=42-days.length;
  for(let d=1;d<=rem;d++)days.push({date:fmt(new Date(y,m+1,d)),cur:false});
  return days;
};

const getWeekDates=ref=>{
  const d=parseD(ref);const dow=d.getDay();
  return Array.from({length:7},(_,i)=>{const nd=new Date(d);nd.setDate(d.getDate()-dow+i);return fmt(nd);});
};

// Compute overlap columns for timed events in a single day
const computeCols=evs=>{
  const timed=evs.filter(e=>e.startTime).map(e=>({...e,sm:timeToMin(e.startTime),em:e.endTime?timeToMin(e.endTime):timeToMin(e.startTime)+60})).sort((a,b)=>a.sm-b.sm);
  const cols=[];
  timed.forEach(ev=>{
    let c=cols.findIndex(end=>end<=ev.sm);
    if(c===-1)c=cols.length;
    cols[c]=ev.em;
    ev._col=c;
  });
  const nCols=cols.length||1;
  return timed.map(ev=>({...ev,col:ev._col,nCols}));
};

// Position an event on the time grid
const evPos=(startTime,endTime)=>{
  if(!startTime)return null;
  const sm=timeToMin(startTime);
  const em=endTime?timeToMin(endTime):sm+60;
  const top=(sm-START_H*60)/60*HOUR_H;
  const height=Math.max(20,(em-sm)/60*HOUR_H-2);
  if(top>(END_H-START_H)*HOUR_H)return null;
  return{top:Math.max(0,top),height};
};

// Generate recurring dates
const generateRecurDates=(startDate,freq,endDate)=>{
  const dates=[];
  const end=parseD(endDate);
  let cur=parseD(startDate);
  while(cur<=end){
    dates.push(fmt(cur));
    if(freq==='weekly')cur.setDate(cur.getDate()+7);
    else if(freq==='biweekly')cur.setDate(cur.getDate()+14);
    else if(freq==='monthly')cur.setMonth(cur.getMonth()+1);
    else break;
    if(dates.length>200)break; // safety
  }
  return dates;
};

/* ── STORAGE ── */
const S={
  get:(k,def)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch{return def;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
};
const DEF_MEMBERS=[{id:'me',name:'自分',color:'#5B5BF6',emoji:'👨'},{id:'wife',name:'妻',color:'#EC4899',emoji:'👩'}];
const DEF_TIME_PRESETS=[

const normBK=b=>{
  if(!b)return null;
  if(b.games)return b;
  return{tournamentName:b.tournamentName||'',venue:b.venue||'',
    games:b.opponent!==undefined?[{opponent:b.opponent||'',myScore:b.myScore??null,opponentScore:b.opponentScore??null}]:[]};

/* ══════════════════════════════════════════════════
   EVENT MODAL (with recurring)
══════════════════════════════════════════════════ */
function EventModal({event,members,initDate,onSave,onDelete,onClose,venueNotes,onSaveVenueNote,timePresets}){

  const[tourn,setTourn]=useState(bk0?.tournamentName||'');
  const[venue,setVenue]=useState(bk0?.venue||'');
  const[games,setGames]=useState(()=>{

  });
  const addGame=()=>setGames(p=>[...p,{opponent:'',myScore:'',opponentScore:''}]);
  const removeGame=idx=>setGames(p=>p.filter((_,i)=>i!==idx));
  const updateGame=(idx,f,v)=>setGames(p=>p.map((g,i)=>i===idx?{...g,[f]:v}:g));

      setVenueNote(venueNotes[trimmed]||'');

      setVenueNote('');
      setEditingVN(false);
    }
  },[venue]);

  const allVenues=Object.keys(venueNotes||{});

  const save=()=>{
    if(!title.trim()){alert('タイトルを入力してください');return;}
    // 会場メモを保存
    if(isBK&&venue.trim()&&onSaveVenueNote){

    }
    const ev={

        <div className="s-hdr">
          <span className="s-title">{event?'予定を編集':'予定を追加'}</span>

            <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
              {(timePresets||DEF_TIME_PRESETS).map(p=>{
                const isActive=p.start===stime&&p.end===etime||(p.start===''&&p.end===''&&stime===''&&etime==='');

          <div className="divider"/>
          <div style={{paddingTop:'10px'}}>
            <div className="fg"><label className="fl">大会名</label><input className="fi" placeholder="例：市民体育大会 春季リーグ" value={tourn} onChange={e=>setTourn(e.target.value)}/></div>
            <div className="fg">
              <label className="fl">会場</label>
              <input className="fi" placeholder="例：〇〇市立体育館" value={venue} onChange={e=>setVenue(e.target.value)} list="venue-list"/>
              {allVenues.length>0&&<datalist id="venue-list">{allVenues.map(v=><option key={v} value={v}/>)}</datalist>}
            </div>
            {/* 会場メモ表示/編集エリア */}
            {venue.trim()&&(
              <div style={{margin:'0 0 10px',background:venueNote?'#FFFBEB':'#F8FAFC',border:`1px solid ${venueNote?'#FCD34D':'#E2E8F0'}`,borderRadius:'10px',padding:'11px 13px'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'6px'}}>
                  <span style={{fontSize:'12px',fontWeight:'700',color:venueNote?'#92400E':'var(--ts)'}}>📍 会場メモ：{venue.trim()}</span>
                  <button style={{border:'none',background:'transparent',fontSize:'11px',color:'var(--p)',fontWeight:'700',cursor:'pointer',padding:'2px 6px'}} onClick={()=>setEditingVN(!editingVN)}>{editingVN?'完了':'編集'}</button>
                </div>
                {editingVN
                  ?<textarea className="fi" rows={3} placeholder="トイレの場所、駐車場情報、独自ルールなどをメモ…" value={venueNote} onChange={e=>setVenueNote(e.target.value)} style={{resize:'none',fontSize:'12px',margin:0}}/>
                  :<div style={{fontSize:'12px',color:venueNote?'#78350F':'var(--tl)',whiteSpace:'pre-wrap',lineHeight:'1.6',minHeight:'18px'}} onClick={()=>setEditingVN(true)}>{venueNote||'タップしてメモを追加…'}</div>
                }
              </div>
            )}
            {/* 複数試合 */}
            {games.map((g,i)=>(
              <div key={i} style={{background:'#F8FAFC',border:'1.5px solid var(--bd)',borderRadius:'12px',padding:'12px',marginBottom:'10px'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'8px'}}>
                  <span style={{fontSize:'12px',fontWeight:'800',color:'var(--p)'}}>第{i+1}試合</span>
                  {games.length>1&&<button onClick={()=>removeGame(i)} style={{border:'none',background:'#FEE2E2',color:'#DC2626',borderRadius:'6px',padding:'3px 9px',fontSize:'11px',fontWeight:'700',cursor:'pointer',touchAction:'manipulation'}}>✕ 削除</button>}
                </div>
                <div className="fg" style={{marginBottom:'8px'}}>
                  <label className="fl">対戦相手</label>
                  <input className="fi" placeholder="例：〇〇クラブ" value={g.opponent} onChange={e=>updateGame(i,'opponent',e.target.value)}/>
                </div>
                <label className="fl">スコア（試合後に記入）</label>
                <div style={{display:'flex',alignItems:'center',gap:'10px',marginTop:'4px'}}>
                  <input className="fi" type="number" min="0" placeholder="自チーム" value={g.myScore} onChange={e=>updateGame(i,'myScore',e.target.value)} style={{textAlign:'center',fontSize:'22px',fontWeight:'800',flex:1}}/>
                  <span style={{fontSize:'22px',fontWeight:'900',color:'var(--ts)',flexShrink:0}}>−</span>
                  <input className="fi" type="number" min="0" placeholder="相手" value={g.opponentScore} onChange={e=>updateGame(i,'opponentScore',e.target.value)} style={{textAlign:'center',fontSize:'22px',fontWeight:'800',flex:1}}/>
                </div>
              </div>
            ))}
            <button onClick={addGame} style={{width:'100%',padding:'10px',border:'1.5px dashed var(--p)',background:'var(--pl)',color:'var(--p)',borderRadius:'10px',fontSize:'13px',fontWeight:'700',cursor:'pointer',touchAction:'manipulation',marginBottom:'8px'}}>
              ＋ 試合を追加
            </button>
          </div>
        </>}

        <div className="divider" style={{margin:'8px 20px'}}/>
        <div className="fg" style={{paddingTop:'12px'}}><label className="fl">メモ</label><textarea className="fi" rows={3} placeholder="メモ・詳細を入力" value={notes} onChange={e=>setNotes(e.target.value)} style={{resize:'none'}}/></div>
        <button className="btn-p" onClick={save}>
          {recur!=='none'&&rEnd&&!event?`${generateRecurDates(date,recur,rEnd).length}件まとめて登録する`:'保存する'}
        </button>
        {event&&<button className="btn-p btn-danger" onClick={()=>{if(confirm('この予定を削除しますか？'))onDelete(event.id);}}>削除する</button>}
        <div style={{height:'8px'}}/>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════
   WEEK VIEW
══════════════════════════════════════════════════ */
function WeekView({events,members,diary,selDate,today,onSelectDate,onNavigate,onEdit,onAdd}){
  const dates=useMemo(()=>getWeekDates(selDate),[selDate]);
  const byDate=useMemo(()=>{const m={};events.forEach(ev=>{if(!m[ev.date])m[ev.date]=[];m[ev.date].push(ev);});return m;},[events]);
  const getMem=id=>members.find(m=>m.id===id);
  const totalH=(END_H-START_H)*HOUR_H;

  // Current time position
  const now=new Date();
  const nowMin=now.getHours()*60+now.getMinutes();
  const nowTop=(nowMin-START_H*60)/60*HOUR_H;
  const showNow=nowMin>=START_H*60&&nowMin<END_H*60;

  const wkStart=dates[0],wkEnd=dates[6];
  const label=`${parseD(wkStart).getMonth()+1}/${parseD(wkStart).getDate()} 〜 ${parseD(wkEnd).getMonth()+1}/${parseD(wkEnd).getDate()}`;

  return(
    <div>
      <div className="wk-nav">
        <button className="cal-nav-btn" onClick={()=>(onNavigate||onSelectDate)(fmt(new Date(parseD(selDate).setDate(parseD(selDate).getDate()-7))))}>‹</button>
        <h2>{label}</h2>
        <button className="cal-nav-btn" onClick={()=>(onNavigate||onSelectDate)(fmt(new Date(parseD(selDate).setDate(parseD(selDate).getDate()+7))))}>›</button>
      </div>

      {/* Day headers */}
      <div className="wk-hdr">
        <div className="wk-hdr-empty"/>
        {dates.map(date=>{
          const d=parseD(date);const dow=d.getDay();const dn=d.getDate();
          const isToday=date===today;const isSel=date===selDate;
          const hasDiary=!!(diary[date]?.trim());
          const hol=isHoliday(date);
          return(
            <div key={date} className="wk-dhdr" onClick={()=>onSelectDate(date)} title={hol||''}>
              <div className={`wk-dhdr-name ${dow===0?'sun':''} ${dow===6?'sat':''}`}>{DAYS[dow]}</div>
              <div className={`wk-dhdr-num ${isToday?'today':''} ${isSel&&!isToday?'sel':''} ${dow===0?'suncol':''} ${dow===6?'satcol':''} ${hol?'holiday':''}`}>{dn}</div>
              {hasDiary&&<div style={{width:5,height:5,borderRadius:1,background:'var(--d)',margin:'2px auto 0'}}/>}
            </div>
          );
        })}
      </div>

      {/* All-day events */}
      <div className="wk-allday">
        <div className="wk-allday-lbl">終日</div>
        {dates.map(date=>{
          const allDay=(byDate[date]||[]).filter(e=>!e.startTime);
          return(
            <div key={date} className="wk-allday-cell">
              {allDay.map(ev=>{
                const mem=getMem(ev.memberId);
                return<div key={ev.id} className="wk-allday-ev" style={{background:mem?.color||'#9CA3AF'}} onClick={()=>onEdit(ev)}>{ev.title}</div>;
              })}
            </div>
          );
        })}
      </div>

      {/* Time grid */}
      <div className="wk-body" style={{maxHeight:'calc(100vh - 310px)'}}>
        <div className="wk-grid" style={{position:'relative'}}>
          {/* Time axis */}
          <div className="wk-time-col" style={{height:`${totalH}px`}}>
            {Array.from({length:END_H-START_H},(_,i)=>(
              <div key={i} className="wk-time-lbl" style={{top:`${i*HOUR_H}px`}}>{pad(START_H+i)}</div>
            ))}
          </div>
          {/* Day columns */}
          {dates.map(date=>{
            const dayEvs=byDate[date]||[];
            const timedCols=computeCols(dayEvs);
            const isToday=date===today;
            return(
              <div key={date} className="wk-day-col" style={{height:`${totalH}px`}}
                onClick={e=>{if(e.target===e.currentTarget){const clickY=e.nativeEvent.offsetY;const h=Math.floor(clickY/HOUR_H)+START_H;onAdd(date,`${pad(h)}:00`);}}}>
                {/* Hour lines */}
                {Array.from({length:END_H-START_H},(_,i)=><React.Fragment key={i}>
                  <div className="wk-h-line" style={{top:`${i*HOUR_H}px`}}/>
                  <div className="wk-hh-line" style={{top:`${i*HOUR_H+HOUR_H/2}px`}}/>
                </React.Fragment>)}
                {/* Now line */}
                {isToday&&showNow&&(
                  <div className="now-line" style={{top:`${nowTop}px`}}>
                    <div className="now-dot"/>
                  </div>
                )}
                {/* Events */}
                {timedCols.map(ev=>{
                  const pos=evPos(ev.startTime,ev.endTime);
                  if(!pos)return null;
                  const mem=getMem(ev.memberId);
                  const w=`calc(${100/ev.nCols}% - 3px)`;
                  const l=`calc(${ev.col*100/ev.nCols}% + 1px)`;
                  return(
                    <div key={ev.id} className="wk-ev"
                      style={{top:`${pos.top}px`,height:`${pos.height}px`,left:l,width:w,background:mem?.color||'#9CA3AF'}}
                      onClick={e=>{e.stopPropagation();onEdit(ev);}}>
                      <div className="wk-ev-t">{ev.title}</div>
                      {pos.height>28&&<div className="wk-ev-sub">{ev.startTime}</div>}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════
   DAY VIEW
══════════════════════════════════════════════════ */
function DayView({events,members,diary,selDate,today,onSelectDate,onEdit,onAdd,onDiaryChange,selectMode,selectedIds,onToggleSelect,onEnterSelect,onExitSelect,onDeleteSelected}){
  const byDate=useMemo(()=>{const m={};events.forEach(ev=>{if(!m[ev.date])m[ev.date]=[];m[ev.date].push(ev);});return m;},[events]);
  const getMem=id=>members.find(m=>m.id===id);
  const totalH=(END_H-START_H)*HOUR_H;
  const dayEvs=byDate[selDate]||[];
  const timedCols=useMemo(()=>computeCols(dayEvs),[dayEvs]);
  const allDay=dayEvs.filter(e=>!e.startTime);

  const now=new Date();
  const nowMin=now.getHours()*60+now.getMinutes();
  const nowTop=(nowMin-START_H*60)/60*HOUR_H;
  const showNow=selDate===today&&nowMin>=START_H*60&&nowMin<END_H*60;

  const d=parseD(selDate);
  const prevDay=()=>onSelectDate(fmt(new Date(d.getFullYear(),d.getMonth(),d.getDate()-1)));

            <button onClick={onExitSelect} style={{border:'1.5px solid var(--bd)',background:'#fff',color:'var(--ts)',borderRadius:'8px',padding:'6px 12px',fontWeight:'700',fontSize:'12px',cursor:'pointer',touchAction:'manipulation'}}>キャンセル</button>
            <span style={{fontSize:'13px',fontWeight:'700',color:'var(--ts)'}}>{selectedIds?.size||0}件選択中</span>
            <button onClick={onDeleteSelected} disabled={!selectedIds?.size} style={{border:'none',background:selectedIds?.size?'#FEE2E2':'#F3F4F6',color:selectedIds?.size?'#DC2626':'var(--tl)',borderRadius:'8px',padding:'6px 12px',fontWeight:'800',fontSize:'12px',cursor:'pointer',touchAction:'manipulation'}}>🗑 削除</button>
          </div>
          :<><button className="dv-nav-btn" onClick={prevDay}>‹</button>
            <div className="dv-title-block">
              <div className="dv-title" style={isHoliday(selDate)?{color:'#EF4444'}:undefined}>
                {fmtJa(selDate)}
                {isHoliday(selDate)&&<span className="holiday-tag">🎌 {isHoliday(selDate)}</span>}
              </div>
              {selDate===today&&<div className="dv-sub" style={{color:'var(--p)'}}>今日</div>}
            </div>
            <button className="dv-nav-btn" onClick={nextDay}>›</button></>
        }
      </div>

      {/* 選択モードの場合の全日イベント選択 / All-day events */}
      {allDay.length>0&&(
        <div className="dv-allday">
          {allDay.map(ev=>{
            const mem=getMem(ev.memberId);
            const isSel=selectedIds?.has(ev.id);
            return(
              <div key={ev.id} className="dv-allday-ev"
                style={{background:isSel?'#EEF2FF':mem?.color+'18'||'var(--pl)',borderLeft:`4px solid ${isSel?'var(--p)':mem?.color||'var(--p)'}`,color:mem?.color||'var(--p)',display:'flex',alignItems:'center',gap:'8px'}}
                onClick={()=>selectMode?onToggleSelect(ev.id):onEdit(ev)}>
                {selectMode&&<div style={{width:20,height:20,borderRadius:'50%',border:`2px solid ${isSel?'var(--p)':'var(--bd)'}`,background:isSel?'var(--p)':'#fff',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  {isSel&&<span style={{color:'#fff',fontSize:'12px',fontWeight:'900'}}>✓</span>}
                </div>}
                <span>{mem?.emoji}</span><span style={{fontWeight:700}}>{ev.title}</span>
                {ev.recurring&&ev.recurring!=='none'&&<span style={{fontSize:'10px',background:'#DCFCE7',color:'#16A34A',borderRadius:'6px',padding:'1px 5px',fontWeight:700}}>繰返</span>}
              </div>
            );
          })}
        </div>
      )}

      {/* Time grid */}
      <div className="dv-body" style={{maxHeight:'calc(100vh - 300px)'}}>
        <div className="dv-time-col" style={{height:`${totalH}px`,position:'relative'}}>
          {Array.from({length:END_H-START_H},(_,i)=>(
            <div key={i} className="dv-time-lbl" style={{top:`${i*HOUR_H}px`}}>{pad(START_H+i)}:00</div>
          ))}
        </div>
        <div className="dv-col" style={{position:'relative',height:`${totalH}px`}}
          onClick={e=>{const clickY=e.nativeEvent.offsetY;const h=Math.floor(clickY/HOUR_H)+START_H;onAdd(selDate,`${pad(h)}:00`);}}>
          {/* Hour lines */}
          {Array.from({length:END_H-START_H},(_,i)=><React.Fragment key={i}>
            <div className="dv-h-line" style={{top:`${i*HOUR_H}px`}}/>
            <div className="dv-hh-line" style={{top:`${i*HOUR_H+HOUR_H/2}px`}}/>
          </React.Fragment>)}
          {/* Now line */}
          {showNow&&<div className="now-line" style={{top:`${nowTop}px`}}><div className="now-dot"/></div>}
          {/* Events */}
          {timedCols.map(ev=>{
            const pos=evPos(ev.startTime,ev.endTime);
            if(!pos)return null;
            const mem=getMem(ev.memberId);
            const w=`calc(${100/ev.nCols}% - 8px)`;
            const l=`calc(${ev.col*100/ev.nCols}% + 4px)`;
            const isSel=selectedIds?.has(ev.id);
            return(
              <div key={ev.id} className="dv-ev"

                onClick={e=>{e.stopPropagation();selectMode?onToggleSelect(ev.id):onEdit(ev);}}>
                {selectMode&&<div style={{position:'absolute',top:3,right:3,width:16,height:16,borderRadius:'50%',border:'2px solid rgba(255,255,255,.8)',background:isSel?'rgba(255,255,255,.9)':'transparent',display:'flex',alignItems:'center',justifyContent:'center'}}>
